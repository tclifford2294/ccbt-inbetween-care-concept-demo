// Tiered auto-response: low = light reinforcement, mid = optional quick reset, high = gentle routing.
function tierFor(level) {
  if (level <= 2) return {
    title: "Glad it's a lighter week",
    lede: "Sounds like things feel manageable right now — nice. A small habit can help keep it that way.",
    actions: [
      { name: "Notice three good things", desc: "A 30-second jot to end the day on — even small ones count.", cta: "Try it", primary: true },
      { name: "Keep one good thing on the calendar", desc: "Protect a little time for something you enjoy this week.", cta: "How" },
    ],
  };
  if (level === 3) return {
    title: "Some pressure — that's normal",
    lede: "A middling week is really common. If you've got two minutes, a quick reset can take the edge off.",
    actions: [
      { name: "Take a 2-minute reset", desc: "A short grounding or breathing exercise to settle your system.", cta: "Start a reset", primary: true },
      { name: "See what's driving it", desc: "A one-question check that points you to support that fits.", cta: "Find support" },
    ],
  };
  return {
    title: "Sounds like a heavy week",
    lede: "That's a lot to carry. A couple of things might help take some weight off — no pressure to do them all.",
    actions: [
      { name: "Find matched support", desc: "Point me to the right help for what's weighing most — work, money, caregiving, or home.", cta: "Find support", primary: true },
      { name: "Take a 2-minute reset", desc: "A quick grounding or breathing exercise for right now.", cta: "Start a reset" },
      { name: "Talk to someone", desc: "A free, confidential counseling session, whenever you're ready.", cta: "Book a session" },
    ],
  };
}

function App() {
  const [idx, setIdx] = useState(0);
  const [shownIdx, setShownIdx] = useState(0);
  const [leaving, setLeaving] = useState(false);
  const [data, setData] = useState({ level: null });

  // Shell bridge: the weekly reading transfers between the Utility and Immersion looks (no sub-stage).
  React.useEffect(() => {
    function onMsg(e) {
      var m = e && e.data;
      if (!m || typeof m !== "object") return;
      if (m.type === "reset:getState") {
        var w = e.source || window.parent;
        if (w) w.postMessage({ type: "reset:state", idx: idx, data: { level: data.level } }, "*");
      } else if (m.type === "reset:next") {
        setIdx(function (i) { return Math.min(i + 1, STEPS.length - 1); });
      } else if (m.type === "reset:prev") {
        setIdx(function (i) { return Math.max(i - 1, 0); });
      } else if (m.type === "reset:setState") {
        if (typeof m.idx === "number") { setIdx(m.idx); setShownIdx(m.idx); setLeaving(false); }
        if (m.data && typeof m.data === "object") {
          var inc = Object.assign({}, m.data);
          delete inc._ex;
          setData(function (d) { return Object.assign({}, d, inc); });
        }
      }
    }
    window.addEventListener("message", onMsg);
    return function () { window.removeEventListener("message", onMsg); };
  }, [idx, data]);

  React.useEffect(() => {
    if (idx === shownIdx) return;
    setLeaving(true);
    const t = setTimeout(() => { setShownIdx(idx); setLeaving(false); }, 950);
    return () => clearTimeout(t);
  }, [idx]);

  const cur = STEPS[idx];
  const shown = STEPS[shownIdx];
  const last = idx === STEPS.length - 1;
  const onPulse = cur.key === "pulse";
  const onResponse = cur.key === "response";

  const frameClass = "frame is-practice";
  const sIntro    = shown.key === "intro";
  const sPulse    = shown.key === "pulse";
  const sResponse = shown.key === "response";
  const sClose    = shown.key === "close";

  // a soft, comforting warmth arrives with the response and stays through the close (regardless of score)
  const warmth = sClose ? 0.55 : sResponse ? 0.4 : 0;
  const canAdvance = onPulse ? data.level != null : true;

  const goNext = () => setIdx(idx + 1);
  const goBack = () => { if (idx > 0) setIdx(idx - 1); };
  const nextLabel = idx === 0 ? "Begin" : onPulse ? "Log this check-in" : onResponse ? "Done for now" : "Continue";

  const actions = last ? (
    <>
      <Button variant="outlined" onClick={() => { setIdx(0); setData({ level: null }); }}>Start over</Button>
      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
        <Button variant="filled" trailingIcon={<IcArrowR size={18} />}>Back to Stress Program</Button>
      </div>
    </>
  ) : idx === 0 ? (
    null
  ) : (
    <>
      <Button variant="outlined" leadingIcon={<IcChevL size={18} />} onClick={goBack}>Go Back</Button>
      <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
        <span className="actions-help">Step {idx + 1} of {STEPS.length}</span>
        <Button variant="filled" trailingIcon={<IcArrowR size={18} />} disabled={!canAdvance} onClick={goNext}>{nextLabel}</Button>
      </div>
    </>
  );

  return (
    <div className={frameClass}>
      <div className="practice-bg-layer">
        <BreathBackground warmth={warmth} breath={null} />
        <div className={"breath-fg" + (leaving ? " is-leaving" : "")}>
          {sIntro && <IntroControls onStart={goNext} />}
          {sPulse && <PulseControls data={data} set={setData} />}
          {sResponse && <ResponseControls data={data} />}
          {sClose && <CloseControls />}
        </div>
      </div>
      <div className="screen">
        <div className="app">
          <HeaderNav />
          <ContentSectionTemplate steps={STEPS} current={idx} actions={actions}
            contentKey={shown.key} leaving={leaving} whole={true}>
            {null}
          </ContentSectionTemplate>
        </div>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

</body>
