<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CCBT · Check-in (Immersion) — Sunrise prototype</title>
  <style>
    /*
     * Material Sunrise — design tokens (inlined so this file is self-contained).
     * Extracted live from the Sunrise Figma files (Foundation & Tokens) and from
     * the GuidanceResources WIP file (Yfpcl4M7hiKSqdzgZBRmDt) on 2026-07-16.
     * Every value maps 1:1 to a Sunrise variable name. Reference these custom
     * properties only — no raw literals in component code. Mirrored in tokens.css.
     * Identical to concept-2.html so both modules share one framework + timing.
     */
    :root {
      /* color roles — accent */
      --sys-primary:            #075cba;
      --sys-on-primary:         #ffffff;
      --sys-primary-container:  #070f36;
      --sys-primary-fixed-dim:  #e3f2fd;
      --sys-tertiary:           #ffffff;

      /* color roles — surface */
      --sys-surface:                    #f3f4f6;
      --sys-surface-container-lowest:   #ffffff;
      --sys-surface-container:          #f3f4f6;
      --sys-surface-container-high:     #eceeef;
      --sys-surface-container-highest:  #e6e8ea;
      --sys-on-surface:                 #1b1d22;
      --sys-on-surface-variant:         #565f6c;

      /* color roles — outline */
      --sys-outline:          #ebecf0;
      --sys-outline-variant:  #d7dbe0;

      /* color roles — custom / status */
      --sys-info:             #226cee;
      --sys-success:          #278647;
      --sys-error:            #d82727;
      --sys-error-container:  #f7d4d4;

      /* color roles — inverse */
      --sys-inverse-on-surface: #ffffff;

      /* color roles — transparent */
      --sys-primary-20:  rgba(7, 92, 186, 0.08);
      --sys-white-80:    rgba(255,255,255,0.80);
      --sys-white-50:    rgba(255,255,255,0.50);
      --sys-black-50:    rgba(0,0,0,0.50);

      /* typography — family (Google Sans is the Sunrise brand face) */
      --font-family: "Google Sans", "Google Sans Text", "Product Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

      /* type scale (size / line-height / tracking / weight) */
      --headline-medium-size: 40px;  --headline-medium-lh: 48px;
      --headline-small-size: 32px;   --headline-small-lh: 38.4px;
      --title-medium-size: 24px;     --title-medium-lh: 31.2px;    --title-medium-weight: 500;
      --body-large-size: 20px;       --body-large-lh: 30px;
      --body-medium-size: 16px;      --body-medium-lh: 24px;
      --body-small-size: 14px;       --body-small-lh: 20px;
      --label-large-size: 16px;      --label-large-lh: 22.4px;     --label-large-weight: 500;
      --label-medium-size: 14px;     --label-medium-lh: 20px;      --label-medium-track: 0.07px;
      --label-small-size: 12px;      --label-small-lh: 18px;       --label-small-weight: 500; --label-small-track: 0.12px;

      /* shape / radius */
      --radius-sm:   8px;
      --radius-md:   12px;
      --radius-lg:   16px;
      --radius-full: 999px;

      /* spacing / padding scale */
      --pad-2: 2px;  --pad-4: 4px;   --pad-8: 8px;   --pad-12: 12px;
      --pad-16: 16px; --pad-20: 20px; --pad-24: 24px; --pad-32: 32px;
      --pad-40: 40px; --pad-48: 48px;

      /* stroke */
      --stroke-thin: 1px;
      --stroke-medium: 1.5px;

      /* elevation */
      --elev-1: 0 2px 8px rgba(0,0,0,0.04), 0 2px 4px rgba(0,0,0,0.06);
      --elev-2: 0 4px 16px rgba(0,0,0,0.10), 0 2px 4px rgba(0,0,0,0.08);

      /* M3 state-layer tints derived from the resolved roles above */
      --state-primary-08:     rgba(7, 92, 186, 0.08);
      --state-on-surface-04:  rgba(27, 29, 34, 0.04);
      --state-on-surface-08:  rgba(27, 29, 34, 0.08);
      --state-error-08:       rgba(216, 39, 39, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--sys-surface); }
    body {
      font-family: var(--font-family);
      color: var(--sys-on-surface);
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; cursor: pointer; }
    input, textarea { font-family: inherit; }
    a { color: var(--sys-primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ---- app frame (no browser chrome) ---- */
    .frame { position: relative; display: flex; flex-direction: column; min-height: 100vh; background: var(--sys-surface); }
    .screen { position: relative; z-index: 1; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }

    /* ---- prototype step navigator (a review control, not part of the app) ---- */
    .stepnav { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 16px; padding: 12px; color: var(--sys-on-surface-variant); font-size: 13px; background: var(--sys-surface); border-top: var(--stroke-thin) solid var(--sys-outline); }
    .stepnav button { background: var(--sys-surface-container-lowest); color: var(--sys-on-surface); border: 1px solid var(--sys-outline-variant); border-radius: var(--radius-full); height: 32px; padding: 0 14px; font-size: 13px; }
    .stepnav button:disabled { opacity: .4; cursor: default; }
    .dots { display: flex; gap: 7px; }
    .dots b { width: 8px; height: 8px; border-radius: 50%; background: var(--sys-outline-variant); display: block; cursor: pointer; }
    .dots b.on { background: var(--sys-primary); }

    /* ---- Sunrise type primitives ---- */
    .sr-headline-m { font-size: var(--headline-medium-size); line-height: var(--headline-medium-lh); font-weight: 400; margin: 0; }
    .sr-headline-s { font-size: var(--headline-small-size); line-height: var(--headline-small-lh); font-weight: 400; margin: 0; }
    .sr-body-m { font-size: var(--body-medium-size); line-height: var(--body-medium-lh); font-weight: 400; }
    .sr-label-l { font-size: var(--label-large-size); line-height: var(--label-large-lh); font-weight: var(--label-large-weight); }
    .sr-label-m { font-size: var(--label-medium-size); line-height: var(--label-medium-lh); font-weight: 400; letter-spacing: var(--label-medium-track); }
    .eyebrow { font-size: var(--label-small-size); line-height: var(--label-small-lh); font-weight: var(--label-small-weight); letter-spacing: .06em; text-transform: uppercase; color: var(--sys-primary); }

    /* ---- Sunrise: Header Navigation ---- */
    .navbar { height: 64px; background: var(--sys-surface-container-lowest); border-bottom: var(--stroke-thin) solid var(--sys-outline); display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 12px; }
    .nav-left { display: flex; align-items: center; gap: var(--pad-4); }
    .nav-right { display: flex; align-items: center; gap: var(--pad-12); }
    .icon-buttons { display: flex; align-items: center; gap: var(--pad-8); }
    .nav-item { width: 40px; height: 40px; border-radius: var(--radius-full); background: transparent; border: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--sys-on-surface); position: relative; }
    .nav-item:hover { background: var(--state-on-surface-04); }
    .brandmark { display: inline-flex; align-items: center; }
    .badge { position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: var(--radius-full); background: var(--sys-primary); color: var(--sys-on-primary); font-size: var(--label-small-size); font-weight: var(--label-small-weight); border: var(--stroke-thin) solid var(--sys-surface-container-lowest); display: inline-flex; align-items: center; justify-content: center; }
    .nav-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--sys-primary-fixed-dim); color: var(--sys-primary); border: var(--stroke-thin) solid var(--sys-primary-20); display: inline-flex; align-items: center; justify-content: center; font-size: var(--label-small-size); font-weight: var(--label-small-weight); }
    .crumbs { display: flex; align-items: center; font-size: var(--label-medium-size); letter-spacing: var(--label-medium-track); }
    .crumbs .crumb { padding: 2px 8px; display: inline-flex; align-items: center; }
    .crumbs .sep { color: var(--sys-on-surface-variant); }
    .crumbs .c-muted { color: var(--sys-on-surface-variant); }
    .crumbs .c-cur { color: var(--sys-on-surface); }
    .emergency { height: 40px; border-radius: var(--radius-full); background: var(--sys-surface-container-lowest); border: var(--stroke-thin) solid var(--sys-error); color: var(--sys-error); display: inline-flex; align-items: center; gap: 8px; padding: 0 16px 0 10px; font-size: var(--label-medium-size); font-weight: 500; white-space: nowrap; }
    .emergency:hover { background: var(--state-error-08); }
    .emergency .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--sys-error); color: #fff; display: inline-flex; align-items: center; justify-content: center; }

    /* ---- Sunrise: Content Section Template (the white card shell) ---- */
    .app { flex: 1; min-height: 0; background: var(--sys-surface); display: flex; flex-direction: column; }
    .section-wrap { flex: 1; min-height: 0; padding: 16px; display: flex; }
    .section-card { position: relative; flex: 1; min-height: 0; background: var(--sys-surface-container-lowest); border-radius: var(--radius-lg); box-shadow: var(--elev-1); display: flex; flex-direction: column; overflow: hidden; }
    .section-progress { position: relative; z-index: 1; padding: 28px 32px 4px; }
    .section-body { position: relative; z-index: 1; flex: 1; min-height: 0; padding: 20px 32px; display: flex; justify-content: center; overflow: auto; }
    .col { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: var(--pad-40); }

    /* immersive sub-flow — cross-dissolve between sub-steps (shared timing) */
    .ex-stage { display: flex; flex-direction: column; gap: var(--pad-40); transition: opacity 220ms ease; }
    .ex-stage.in  { opacity: 1; }
    .ex-stage.out { opacity: 0; }
    /* staggered entrance applied to every step's content blocks — identical timing to concept-2 */
    @keyframes revealIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .col > *:not(.ex-stage), .ex-stage > * { animation: revealIn .7s ease both; }
    .col > *:not(.ex-stage):nth-child(1), .ex-stage > *:nth-child(1) { animation-delay: 0s; }
    .col > *:not(.ex-stage):nth-child(2), .ex-stage > *:nth-child(2) { animation-delay: .55s; }
    .col > *:not(.ex-stage):nth-child(3), .ex-stage > *:nth-child(3) { animation-delay: 1.25s; }
    .col > *:not(.ex-stage):nth-child(4), .ex-stage > *:nth-child(4) { animation-delay: 1.95s; }
    .col > *:not(.ex-stage):nth-child(5), .ex-stage > *:nth-child(5) { animation-delay: 2.65s; }
    /* Intro / Learn / Done: whole content fades in together (no stagger) */
    .col--whole { animation: revealIn .7s ease both; }
    .col--whole > * { animation: none !important; }
    /* leaving a step: the whole card content fades + drops off-screen to make room */
    .col--leaving, .col--leaving.col--whole { animation: colLeave .45s cubic-bezier(.4,0,1,1) both !important; }
    .col--leaving > * { animation: none !important; }
    @keyframes colLeave { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(56px); } }
    .ex-recap { display: flex; flex-direction: column; gap: 6px; }
    .ex-recap .k { font-size: var(--label-small-size); line-height: var(--label-small-lh); font-weight: var(--label-small-weight); letter-spacing: .06em; text-transform: uppercase; color: var(--sys-on-surface-variant); }
    .section-actions { position: relative; z-index: 1; border-top: var(--stroke-thin) solid var(--sys-outline); padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .actions-help { color: var(--sys-on-surface-variant); font-size: var(--label-medium-size); }

    /* ---- Sunrise: Progress Tracker (underline step-tabs) ---- */
    .ptrack { display: flex; gap: 8px; max-width: 860px; margin: 0 auto; }
    .ptab { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; background: transparent; border: 0; padding: 0; text-align: left; }
    .ptab .lbl { font-size: var(--label-medium-size); line-height: var(--label-medium-lh); color: var(--sys-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ptab.done .lbl, .ptab.cur .lbl { color: var(--sys-on-surface); font-weight: 500; }
    .ptab .bar { height: 3px; border-radius: var(--radius-full); background: var(--sys-outline-variant); }
    .ptab.done .bar, .ptab.cur .bar { background: var(--sys-success); }

    /* ---- Sunrise: Button ---- */
    .sr-btn { height: 48px; border-radius: var(--radius-full); padding: 0 24px; font-size: var(--label-large-size); line-height: var(--label-large-lh); font-weight: var(--label-large-weight); display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: var(--stroke-thin) solid transparent; transition: filter .12s, background .12s; }
    .sr-btn--filled { background: var(--sys-primary); color: var(--sys-on-primary); }
    .sr-btn--filled:hover { filter: brightness(1.08); }
    .sr-btn--filled:disabled { background: var(--sys-surface-container-high); color: var(--sys-on-surface-variant); cursor: default; filter: none; }
    .sr-btn--outlined { background: var(--sys-surface-container-lowest); color: var(--sys-on-surface); border-color: var(--sys-outline-variant); }
    .sr-btn--outlined:hover { background: var(--state-on-surface-04); }
    .sr-btn--text { background: transparent; color: var(--sys-primary); height: 44px; padding: 0 12px; }
    .sr-btn--text:hover { background: var(--state-primary-08); }
    .sr-btn--tonal { background: var(--sys-primary-fixed-dim); color: var(--sys-primary); }
    .sr-btn--tonal:hover { filter: brightness(0.97); }

    /* ---- Sunrise: Input Field ---- */
    .sr-field { display: flex; flex-direction: column; gap: 8px; }
    .sr-flabel { display: flex; gap: 4px; align-items: center; font-size: var(--body-medium-size); line-height: var(--body-medium-lh); font-weight: 500; color: var(--sys-on-surface); }
    .sr-fhelp { font-size: var(--label-medium-size); line-height: var(--label-medium-lh); color: var(--sys-on-surface-variant); }
    .sr-input, .sr-textarea { width: 100%; border-radius: var(--radius-md); border: var(--stroke-thin) solid var(--sys-outline-variant); background: var(--sys-surface-container-lowest); padding: 14px 16px; font-size: var(--body-medium-size); line-height: var(--body-medium-lh); color: var(--sys-on-surface); outline: none; transition: border-color .12s, box-shadow .12s; }
    .sr-input { height: 56px; padding: 0 16px; }
    .sr-textarea { resize: vertical; min-height: 88px; }
    .sr-input::placeholder, .sr-textarea::placeholder { color: var(--sys-on-surface-variant); }
    .sr-input:focus, .sr-textarea:focus { border-color: var(--sys-primary); box-shadow: 0 0 0 1px var(--sys-primary); }

    /* ---- Sunrise: Divider ---- */
    .sr-divider { height: 1px; background: var(--sys-outline); border: 0; width: 100%; margin: 0; }

    /* ---- Sunrise: Card ---- */
    .sr-card { background: var(--sys-surface-container-lowest); border-radius: var(--radius-lg); border: 1px solid var(--sys-outline); box-shadow: var(--elev-1); padding: var(--pad-24); }
    .sr-card--muted { background: var(--sys-surface-container); border: 0; box-shadow: none; }

    /* ---- Sunrise: Card Item / Style=Image (hero media card, node 1340:17442) ---- */
    .herocard { position: relative; width: 100%; min-height: 156px; border-radius: var(--radius-lg); overflow: hidden;
      background: linear-gradient(135deg, var(--sys-primary-container) 0%, var(--sys-primary) 150%); }
    .herocard .hc-media { position: absolute; inset: 0; background-image: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.12) 40%, rgba(0,0,0,0.12) 60%, rgba(0,0,0,0.4) 100%); mix-blend-mode: multiply; pointer-events: none; }
    .herocard .hc-content { position: relative; min-height: 156px; padding: var(--pad-16); display: flex; flex-direction: column; justify-content: space-between; gap: var(--pad-24); }
    .herocard .hc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; width: 100%; }
    .herocard .hc-icon { width: 32px; height: 32px; flex: none; color: var(--sys-inverse-on-surface); display: inline-flex; }
    .herocard .hc-text { display: flex; flex-direction: column; gap: var(--pad-2); }
    .herocard .hc-title { font-size: var(--body-large-size); line-height: var(--body-large-lh); font-weight: 400; color: var(--sys-inverse-on-surface); margin: 0; }
    .herocard .hc-desc { font-size: var(--body-small-size); line-height: var(--body-small-lh); color: var(--sys-white-80); }
    .herocard .hc-chip { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: var(--radius-full); background: rgba(255,255,255,0.14); color: var(--sys-inverse-on-surface); font-size: var(--label-small-size); font-weight: var(--label-small-weight); white-space: nowrap; }

    /* ---- Sunrise: Selection Card (selectable row) ---- */
    .selcard { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--sys-surface-container-lowest); border: var(--stroke-thin) solid var(--sys-outline-variant); border-radius: var(--radius-md); padding: 16px 18px; min-height: 56px; transition: background .12s, border-color .12s, box-shadow .12s; }
    .selcard:hover { background: var(--sys-surface-container-lowest); border-color: var(--sys-primary); box-shadow: 0 0 0 1px var(--sys-primary); }
    .selcard.sel { border-color: var(--sys-primary); border-width: var(--stroke-medium); background: var(--sys-surface-container-lowest); }
    .selcard .lead { color: var(--sys-on-surface-variant); display: inline-flex; }
    .selcard.sel .lead { color: var(--sys-primary); }
    .selcard .txt { flex: 1; font-size: var(--body-medium-size); line-height: var(--body-medium-lh); color: var(--sys-on-surface); }
    .selcard .txt.ph { color: var(--sys-on-surface-variant); }
    .selcard .check { width: 22px; height: 22px; flex: none; border-radius: 6px; border: 2px solid var(--sys-outline-variant); display: inline-flex; align-items: center; justify-content: center; color: transparent; }
    .selcard.sel .check { background: var(--sys-primary); border-color: var(--sys-primary); color: #fff; }

    /* ---- "An example" broken into step boxes (per Option Card style) ---- */
    .ex-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 12px; }
    .ex-grid--3 { grid-template-columns: repeat(3, 1fr); }
    .ex-box { display: flex; flex-direction: column; justify-content: flex-start; gap: var(--pad-24); min-height: 208px;
      background: var(--sys-surface-container-lowest); border: var(--stroke-thin) solid var(--sys-outline-variant);
      border-radius: var(--radius-md); padding: 18px; }
    .ex-box .ex-top { display: flex; align-items: flex-start; justify-content: space-between; }
    .ex-box .ex-chip { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--sys-surface-container-high);
      color: var(--sys-on-surface); display: inline-flex; align-items: center; justify-content: center; }
    .ex-box .ex-info { color: var(--sys-on-surface-variant); display: inline-flex; }
    .ex-box .ex-text { display: flex; flex-direction: column; gap: 4px; }
    .ex-box .ex-sub { font-size: var(--label-small-size); line-height: var(--label-small-lh); font-weight: var(--label-small-weight); color: var(--sys-on-surface-variant); }
    .ex-box .ex-copy { margin: 0; font-size: var(--body-medium-size); line-height: var(--body-medium-lh); color: var(--sys-on-surface); }

    /* ---- NonSystem breathing player ----
     * The breathing lives in a PERSISTENT full-screen layer that sits behind the app.
     * On the Practice step it dissolves IN; on leaving Practice it dissolves OUT. The
     * nav / progress / footer stay mounted on top of it the whole time. ---- */
    /* Entering Practice is a SLOW, immersive fade-in (asymmetric: ~1.6s in, quicker out). */
    .practice-bg-layer { position: fixed; inset: 0; z-index: 0; overflow: hidden;
      opacity: 0; pointer-events: none; transition: opacity .55s ease; }
    .frame.is-practice .practice-bg-layer { opacity: 1; pointer-events: auto; transition: opacity 1.6s ease; }

    /* the color field gently zoom-settles as it fades in, drawing the user inward */
    /* Concept 3: the branded "Pathways in motion" papercut (inlined so its waves can breathe) */
    .breathe2 { position: absolute; inset: 0; overflow: hidden; transform: scale(1.09);
      background: #F2F1E6; transition: transform .6s ease; }
    .frame.is-practice .breathe2 { transform: scale(1);
      transition: transform 2.3s cubic-bezier(.16,1,.3,1); }
    .paper-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    /* a gentle, constant sway on each wave layer — life underneath the breath-driven swell (parallax) */
    .wave-drift-1 { transform-box: view-box; animation: waveSway1 13s ease-in-out infinite; }
    .wave-drift-2 { transform-box: view-box; animation: waveSway2 17s ease-in-out infinite; }
    @keyframes waveSway1 { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-22px); } }
    @keyframes waveSway2 { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(16px); } }

    /* concentric ripple — translucent circles that scale with the breath */
    .b2-orb { position: absolute; top: 50%; left: 50%; width: 340px; height: 340px;
      transform: translate(-50%, -50%) scale(0.55); transition: transform 4s ease-in-out, opacity .5s ease;
      opacity: 0; will-change: transform; pointer-events: none; }
    .breathe2.is-in .b2-orb, .breathe2.is-out .b2-orb { opacity: 1; }
    /* soft frosted bloom — reads as a gentle breathing glow on the light papercut */
    .b2-ring { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.4); }
    .b2-ring.a { inset: 0; } .b2-ring.b { inset: 12%; } .b2-ring.c { inset: 26%; }
    .b2-ring.d { inset: 40%; background: rgba(255,255,255,0.62); }

    /* foreground controls — inset so they clear the nav (top) and footer/stepnav (bottom) */
    /* controls always read dark on the light papercut background */
    .breath-ui { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 200px 24px 150px; color: var(--sys-primary-container); }
    /* IN: the incoming section fades in and slides UP into place — same 0.6s speed and easing as the
       dissolve-out below, so the two read as one consistent, calming motion. */
    .frame.is-practice .breath-ui { animation: breathUiIn .6s cubic-bezier(.4,0,.2,1) both; }
    @keyframes breathUiIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

    /* OUT: on a step change the outgoing section fades out and slides DOWN over the persistent
       papercut (which never moves) — the exact mirror of the in. The transition is declared only on
       the leaving state, so when it's removed the wrapper snaps back and breathUiIn cleanly owns the
       entrance (no double motion). Both directions share 0.6s + the same easing. */
    .breath-fg { position: absolute; inset: 0; z-index: 1; }
    .breath-fg.is-leaving { opacity: 0; transform: translateY(18px);
      transition: opacity .6s cubic-bezier(.4,0,.2,1), transform .6s cubic-bezier(.4,0,.2,1); }

    /* generous, consistent vertical rhythm between the icon/head, title and the component below —
       shared across Practice, Reflect, Homework and Done so they all breathe the same way */
    .b2-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; padding: 0 24px; }
    /* DS Emphasized / Headline / Headline Medium — 40/48, Google Sans Medium (500), tracking 0 */
    .b2-phase { font-size: var(--headline-medium-size); line-height: var(--headline-medium-lh); font-weight: 500; letter-spacing: 0; text-shadow: 0 2px 22px rgba(255,255,255,0.5); }
    /* shared supporting lede beneath the hero title — one editorial voice across every step */
    .b2-sub { margin: 0; max-width: 560px; font-size: var(--body-large-size); line-height: var(--body-large-lh);
      color: var(--sys-primary-container); opacity: .8; text-align: center; text-wrap: balance; transition: opacity .6s ease; }
    /* during active breathing the guidance recedes so Practice stays pure */
    .breath-ui.is-in .b2-sub, .breath-ui.is-out .b2-sub { opacity: 0; }

    /* Practice — graphic-first composition: the enlarged breath visual is the hero; the guiding
       word sits in its heart (overlapping center), and the controls dock quietly lower down. */
    .breath-practice { padding: 0; }
    .bp-hero { position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%); padding: 0 24px;
      display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .bp-hero .sr-btn { margin-top: 10px; }

    /* time + phase stacked; the time is a small, faint secondary label above the phase,
       hidden until the session starts then fading in. */
    .b2-head { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .b2-time { font-family: var(--font-family); font-size: 15px; font-weight: 500; letter-spacing: .06em;
      font-variant-numeric: tabular-nums; color: var(--sys-primary-container); opacity: .45; transition: opacity .8s ease; }
    .breath-ui.is-ready .b2-time { opacity: 0; }
    .b2-play { width: 72px; height: 72px; border-radius: 50%; border: 0; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 10px 34px rgba(5,7,15,0.2);
      background: var(--sys-primary); color: var(--sys-on-primary); transition: filter .12s; }
    .b2-play:hover { filter: brightness(1.06); }

    /* ===== Practice = full-screen breathing behind a persistent UI frame =====
     * The app + card go transparent (transitioned) so the breathing shows through, and
     * clicks fall through the empty card to the breathing controls — while the nav,
     * progress and footer stay interactive on top. */
    .app, .section-wrap, .section-card { transition: background-color .6s ease, box-shadow .6s ease; }
    .frame.is-practice .app,
    .frame.is-practice .section-wrap,
    .frame.is-practice .section-card { background: transparent; transition: background-color 1.4s ease, box-shadow 1.4s ease; }
    .frame.is-practice .section-card { box-shadow: none; }
    .frame.is-practice .screen { pointer-events: none; }
    .frame.is-practice .navbar,
    .frame.is-practice .section-progress,
    .frame.is-practice .section-actions { pointer-events: auto; }
    /* nav transparent so the breathing extends behind it */
    .frame.is-practice .navbar { background: transparent; border-bottom-color: transparent; }
    /* the footer + prototype step-nav go transparent too, so the whole screen is papercut */
    .frame.is-practice .section-actions { border-top-color: transparent; }
    .frame.is-practice .stepnav { background: transparent; border-top-color: transparent; }

    /* smooth chrome recolor when the breathing goes light↔dark */
    .navbar, .navbar .nav-item, .crumbs a, .crumbs .c-cur, .crumbs .c-muted, .crumbs .sep,
    .ptab .lbl, .actions-help { transition: color .5s ease, background .5s ease; }
    .brandmark path { transition: fill .5s ease; }
    /* when the breathing is DARK (running in/out), flip the frame chrome to light glass */
    .frame.is-dark .navbar { background: rgba(255,255,255,0.08); border-bottom-color: rgba(255,255,255,0.16);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    .frame.is-dark .navbar .nav-item { color: var(--sys-on-primary); }
    .frame.is-dark .nav-item:hover { background: rgba(255,255,255,0.16); }
    .frame.is-dark .crumbs a, .frame.is-dark .crumbs .c-cur,
    .frame.is-dark .crumbs .c-muted, .frame.is-dark .crumbs .sep { color: rgba(255,255,255,0.9); }
    .frame.is-dark .brandmark path { fill: rgba(255,255,255,0.92); }
    .frame.is-dark .ptab .lbl { color: rgba(255,255,255,0.6); }
    .frame.is-dark .ptab.done .lbl, .frame.is-dark .ptab.cur .lbl { color: #fff; }
    .frame.is-dark .section-actions { border-top-color: rgba(255,255,255,0.18); }
    .frame.is-dark .actions-help { color: rgba(255,255,255,0.75); }
    /* filled Continue → white pill so it stays visible on the primary-blue inhale */
    .frame.is-dark .sr-btn--filled { background: var(--sys-surface-container-lowest); color: var(--sys-primary); }
    .frame.is-dark .sr-btn--filled:hover { filter: brightness(0.97); }

    /* callout quote */
    .quote { display: flex; gap: 14px; }
    .quote .bar { width: 3px; border-radius: 2px; background: var(--sys-primary); flex: none; }

    /* NonSystem mood meter — a playful, relaxing mood check */
    .mood { display: flex; flex-direction: column; gap: 18px; align-items: center; padding: 4px 0 2px; }
    .mood-word { font-size: 22px; line-height: 1.2; font-weight: 600; color: var(--sys-on-surface); transition: color .2s ease; }
    .mood-slider { position: relative; width: 100%; height: 64px; }
    .mood-track { position: absolute; top: 50%; left: 0; right: 0; height: 16px; transform: translateY(-50%); border-radius: var(--radius-full);
      background: linear-gradient(90deg, #c9d3e8 0%, #e9e2ec 50%, #ffe1a6 100%); }
    .mood-range { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: grab; }
    .mood-range:active { cursor: grabbing; }
    .mood-thumb { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 56px; height: 56px; border-radius: 50%;
      background: #fff; box-shadow: 0 6px 16px rgba(0,0,0,0.16); display: flex; align-items: center; justify-content: center;
      pointer-events: none; transition: left .1s ease; }
    .mood-glow { position: absolute; inset: -8px; border-radius: 50%; animation: moodBreathe 3.6s ease-in-out infinite; }
    @keyframes moodBreathe { 0%, 100% { transform: scale(1); opacity: .45; } 50% { transform: scale(1.18); opacity: .8; } }
    .mood-scale { display: flex; justify-content: space-between; width: 100%; font-size: var(--label-small-size); color: var(--sys-on-surface-variant); }
    .ns-note { font-size: 11px; color: var(--sys-on-surface-variant); font-style: italic; }

    /* NonSystem mood FACES (Concept 3 Reflect) — a row of faces; each highlights on hover,
       the chosen one stays highlighted. */
    .mfaces { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 4px 0 2px; }
    .mfaces-row { display: flex; gap: 16px; }
    .mface { background: transparent; border: 0; padding: 6px; border-radius: 50%; cursor: pointer; line-height: 0;
      opacity: .4; filter: grayscale(.55); transform: scale(1);
      transition: opacity .25s ease, filter .25s ease, transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease; }
    .mface:hover, .mface.hov { opacity: 1; filter: none; transform: scale(1.12); }
    .mface.sel { opacity: 1; filter: none; transform: scale(1.18); box-shadow: 0 0 0 3px var(--sys-primary); }
    .mfaces-word { font-size: 22px; line-height: 1.2; font-weight: 600; color: var(--sys-on-surface); min-height: 27px; transition: color .2s ease; }
    .mfaces-word.ph { font-size: 16px; font-weight: 400; color: var(--sys-on-surface-variant); }
    .mfaces-scale { display: flex; justify-content: space-between; width: 100%; font-size: var(--label-small-size); color: var(--sys-on-surface-variant); }

    /* Reflect slider (Concept 3) — a white thumb on a soft track; the papercut warms as it moves */
    .rslider { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
    .rslider-track { position: relative; width: 100%; height: 8px; border-radius: var(--radius-full); background: rgba(7,15,54,0.14); }
    .rslider-thumb { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 34px; height: 34px; border-radius: 50%;
      background: var(--sys-surface-container-lowest); box-shadow: 0 6px 18px rgba(5,7,15,0.22); pointer-events: none; transition: left .06s linear; }
    .rslider input[type=range] { position: absolute; inset: -13px 0; width: 100%; height: 34px; margin: 0; opacity: 0; cursor: grab; }
    .rslider input[type=range]:active { cursor: grabbing; }
    .rslider-scale { display: flex; justify-content: space-between; width: 100%; font-size: var(--label-small-size); color: var(--sys-primary-container); opacity: .6; }
    /* extra breathing room between the title and the slider */
    .reflect-ui .rslider { margin-top: 26px; }
    /* the expressive face above the title (mirrors the slider) gets a soft lift */
    .reflect-ui .b2-center > svg { filter: drop-shadow(0 10px 22px rgba(5,7,15,0.14)); }

    /* Homework (Concept 3) — immersive: big title + DS description + the 3 cue options */
    /* Homework (Concept 3) — immersive: big title + DS description + the 3 cue options.
       Options are sized to match the enlarged Done recap panel (same 600px width, roomy cards). */
    .home-head { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 560px; }
    .home-desc { margin: 0; font-size: var(--body-large-size); line-height: var(--body-large-lh); color: var(--sys-primary-container); opacity: .72; text-align: center; }
    /* stretch the center so the 600px-wide options aren't collapsed by the short title */
    .home-ui .b2-center { align-self: stretch; }
    .home-options { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 600px; margin: 0 auto; }
    .home-options .selcard { padding: 22px 28px; min-height: 76px; border-radius: var(--radius-lg); gap: 18px; }
    .home-options .selcard .txt { font-size: var(--body-large-size); line-height: var(--body-large-lh); }

    /* Done (Concept 3) — same immersive papercut frame as Practice/Reflect: a check medallion,
       the closing affirmation, and a translucent recap panel that sits on the papercut. */
    .done-ui .b2-phase { max-width: 760px; text-wrap: balance; }
    .done-ui .b2-center { padding-left: 12px; padding-right: 12px; }
    .done-recap { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 22px;
      padding: 34px 40px; border-radius: var(--radius-lg); text-align: left;
      background: rgba(255,255,255,0.5); border: var(--stroke-thin) solid rgba(255,255,255,0.6);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 14px 40px rgba(5,7,15,0.12); }
    .done-row { display: flex; flex-direction: column; gap: 6px; }
    .done-label { font-size: var(--label-medium-size); line-height: var(--label-medium-lh); font-weight: 600;
      letter-spacing: .06em; text-transform: uppercase; color: var(--sys-primary-container); opacity: .7; }
    .done-val { font-size: var(--body-large-size); line-height: var(--body-large-lh); color: var(--sys-primary-container); }
    .done-div { height: var(--stroke-thin); background: rgba(7,15,54,0.12); }

    /* Intro (Concept 3) — Apple-style hero. Two scannable zones: the MESSAGE (accent eyebrow +
       hero title + one-line subhead, grouped tight) and the ACTION (CTA + a quiet reassurance
       caption). The shared 44px b2-center gap holds the two zones apart; tight internal gaps
       bind each into a single unit — so the eye reads message → action with no competing pills. */
    .intro-head { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    /* shared Apple-style eyebrow — an accent label sitting tight above a step title (Intro, Learn) */
    .step-kicker { font-size: var(--label-medium-size); line-height: var(--label-medium-lh); font-weight: 600;
      letter-spacing: .18em; text-transform: uppercase; color: var(--sys-primary); }
    .intro-ui .b2-phase { max-width: 680px; text-wrap: balance; }
    .intro-lede { margin: 6px 0 0; max-width: 470px; font-size: var(--body-large-size); line-height: var(--body-large-lh);
      color: var(--sys-primary-container); opacity: .66; text-align: center; text-wrap: balance; }
    /* fine-print meta line (à la Apple's price line): small text, but wrapped in a soft glass pill
       for a touch more prominence. Same font size — only a container fill is added. */
    .intro-meta { margin-top: 14px; display: inline-flex; align-items: center; padding: 7px 16px;
      border-radius: var(--radius-full); background: rgba(255,255,255,0.55);
      border: var(--stroke-thin) solid rgba(255,255,255,0.65);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      font-size: var(--label-medium-size); line-height: var(--label-medium-lh);
      letter-spacing: .01em; color: var(--sys-primary-container); opacity: .8; }
    /* Intro actions — primary CTA with a lighter Go Back stacked beneath it */
    .intro-actions { display: flex; flex-direction: column; align-items: center; gap: 10px; }

    /* Learn (Concept 3) — immersive: title + lede + a row of 3 glass "pattern" cards.
       The count (4 / 6) is the hero of each card — an Apple-clean, legible rhythm. */
    .learn-ui .b2-center { align-self: stretch; }
    .learn-head { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 620px; margin: 0 auto; }
    .learn-lede { margin: 0; font-size: var(--body-large-size); line-height: var(--body-large-lh);
      color: var(--sys-primary-container); opacity: .8; text-align: center; text-wrap: balance; }
    .learn-steps { display: flex; flex-wrap: nowrap; gap: 14px; width: 100%; max-width: 940px; margin: 0 auto; }
    .learn-card { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
      padding: 24px 22px 26px; border-radius: var(--radius-lg); text-align: left;
      background: rgba(255,255,255,0.5); border: var(--stroke-thin) solid rgba(255,255,255,0.6);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 14px 40px rgba(5,7,15,0.12);
      /* the cards reveal AFTER the head has settled, then stagger in left→right — a gentle Apple-style
         fade + rise on a smooth decelerating ease. Slow duration + wider stagger for a calm cascade. */
      animation: learnCardIn 1.15s cubic-bezier(.16,1,.3,1) both; }
    .learn-card:nth-child(1) { animation-delay: .6s; }
    .learn-card:nth-child(2) { animation-delay: .84s; }
    .learn-card:nth-child(3) { animation-delay: 1.08s; }
    .learn-card:nth-child(4) { animation-delay: 1.32s; }
    @keyframes learnCardIn { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }

    /* ============================================================
       Breath visuals (Concept 3) — a set of calming breathing animations you can filter between
       on Practice to compare. Each swells on the in-breath and settles on the out-breath, paced to
       the 4s/6s timer via inline transitions. They sit behind the phase text on the papercut.
       ============================================================ */
    /* the visual is the hero — scaled up large so it dominates the screen and bleeds toward the edges */
    .breath-visual { position: absolute; inset: 0; z-index: 0; transform: scale(1.62); transform-origin: center 47%;
      animation: bvFadeIn 1s ease both; transition: filter .9s ease; }
    @keyframes bvFadeIn { from { opacity: 0; } to { opacity: 1; } }
    /* before the session starts (and while paused) the effect is dimmed for text contrast; it
       returns to full saturation once breathing is under way. (filter, so the fade-in still works) */
    .breath-visual.is-dim { filter: brightness(.6) saturate(.72) opacity(.62); }
    .vis { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .vis > * { position: absolute; }

    /* Aura — a luminous layered orb that brightens and expands as you breathe in */
    .aura-l { border-radius: 50%; width: 300px; height: 300px; will-change: transform, opacity; }
    .aura-core { background: radial-gradient(circle, rgba(255,255,255,.96), rgba(150,190,255,.55) 55%, rgba(130,170,245,0) 72%); filter: blur(4px); }
    .aura-mid  { background: radial-gradient(circle, rgba(160,200,255,.55), rgba(120,165,240,0) 70%); filter: blur(22px); }
    .aura-out  { background: radial-gradient(circle, rgba(120,165,240,.4), rgba(120,165,240,0) 70%); filter: blur(46px); }

    /* Ripple — concentric rings that scale with the breath, plus a gentle constant emanation */
    .rip-wrap, .orbit-wrap, .bloom-wrap { position: absolute; width: 0; height: 0; display: flex; align-items: center; justify-content: center; }
    .rip { border-radius: 50%; border: 2px solid rgba(50,105,205,.55); }
    .rip.r1 { width: 130px; height: 130px; }
    .rip.r2 { width: 230px; height: 230px; opacity: .78; }
    .rip.r3 { width: 330px; height: 330px; opacity: .58; }
    .rip.r4 { width: 440px; height: 440px; opacity: .38; }
    .rip-core { width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.92), rgba(150,190,255,.45) 70%, transparent); filter: blur(2px); }
    .rip-pulse { width: 130px; height: 130px; border-radius: 50%; border: 2px solid rgba(50,105,205,.4); animation: ripPulse 6.5s ease-out infinite; }
    .rip-pulse.d2 { animation-delay: 3.25s; }
    @keyframes ripPulse { 0% { transform: scale(.42); opacity: .55; } 100% { transform: scale(3.4); opacity: 0; } }

    /* Bloom — a radial mandala whose petals open on the in-breath */
    .petal { position: absolute; top: 50%; left: 50%; width: 66px; height: 128px; border-radius: 50% 50% 46% 46% / 62% 62% 38% 38%;
      background: linear-gradient(180deg, rgba(108,158,242,.82), rgba(60,112,208,.5)); will-change: transform; }
    .bloom-core { position: absolute; top: 50%; left: 50%; width: 66px; height: 66px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.95), rgba(155,198,255,.5) 70%, transparent); filter: blur(1px); }

    /* Aurora — soft drifting mesh-gradient clouds that swell with the breath */
    .aur-blob { width: 400px; height: 400px; border-radius: 50%; filter: blur(62px); will-change: transform, translate; }
    .aur-blob.b1 { background: radial-gradient(circle, rgba(90,150,255,.85), transparent 68%); animation: aurDrift1 17s ease-in-out infinite; }
    .aur-blob.b2 { background: radial-gradient(circle, rgba(110,215,230,.7), transparent 68%); animation: aurDrift2 21s ease-in-out infinite; }
    .aur-blob.b3 { background: radial-gradient(circle, rgba(165,150,255,.62), transparent 68%); animation: aurDrift3 25s ease-in-out infinite; }
    @keyframes aurDrift1 { 0%,100% { translate: -46px -34px; } 50% { translate: 40px 28px; } }
    @keyframes aurDrift2 { 0%,100% { translate: 44px -30px; } 50% { translate: -38px 34px; } }
    @keyframes aurDrift3 { 0%,100% { translate: -20px 44px; } 50% { translate: 26px -40px; } }

    /* Orbit — a constellation ring that expands on the in-breath, with a gentle twinkle */
    .odot { position: absolute; top: 50%; left: 50%; width: 15px; height: 15px; border-radius: 50%; background: radial-gradient(circle, #7db0ff, #2f6fd0);
      box-shadow: 0 0 16px rgba(55,115,215,.6); animation: odotTwinkle 4.5s ease-in-out infinite; }
    .orbit-core { position: absolute; top: 50%; left: 50%; width: 42px; height: 42px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.9), rgba(150,190,255,.32) 70%, transparent); filter: blur(1px); }
    @keyframes odotTwinkle { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

    /* Dark-field visuals (Nebula, Particles) bring their own deep backdrop so the neon reads; the
       chrome flips to light glass (.frame.is-dark) and the phase text goes light. */
    .bvis-dark-bg { position: absolute; inset: 0; z-index: 0; animation: bvFadeIn 1s ease both;
      background: radial-gradient(circle at 50% 44%, #10142b 0%, #070a18 55%, #03040b 100%); }
    .frame.is-dark .b2-phase { color: #fff; text-shadow: 0 2px 30px rgba(0,0,0,.55); }
    .frame.is-dark .b2-sub { color: rgba(255,255,255,.72); }
    .frame.is-dark .b2-time { color: rgba(255,255,255,.6); }

    /* Glow — an original liquid gradient orb rendered with a WebGL shader (domain-warped fractal
       noise) for true flowing, wispy motion. A soft CSS gradient sits behind as a no-WebGL fallback.
       A light-field visual. (Inspired by, not copied from, stock art.) */
    .glow { position: absolute; width: 360px; height: 360px; }
    .glow-halo { position: absolute; inset: -58px; border-radius: 50%; filter: blur(46px);
      background: radial-gradient(circle, rgba(60,140,255,.5), rgba(70,120,235,.3) 55%, transparent 72%); }
    /* a seated shadow beneath the orb so it separates from the pale papercut */
    .glow-shadow { position: absolute; inset: 18px; border-radius: 50%; box-shadow: 0 22px 54px rgba(10,38,100,.34); }
    .glow-orb { position: absolute; inset: 0; border-radius: 50%; /* static fallback base */
      background: linear-gradient(150deg, #2e7be0 0%, #5aa6ff 45%, #1f5cc0 100%); }
    .glow-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* Particles — an original volumetric particle-sphere built with real CSS 3D transforms: points
       on a Fibonacci sphere, gently spinning; nearer points render larger via perspective. */
    .ps-perspective { perspective: 1100px; }
    .ps-spin { position: absolute; top: 50%; left: 50%; width: 0; height: 0; transform-style: preserve-3d;
      animation: psSpin 30s linear infinite; }
    .pdot { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; will-change: transform; }
    @keyframes psSpin { to { transform: rotateY(360deg); } }
    /* fade particles out through the center so they don't clutter the title/description/button */
    .ps-fog { position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle at 50% 50%, #0d1126 0px, #0d1126 66px, rgba(13,17,38,0) 205px); }

    /* Particles 2 — the light-mode, on-brand sibling. Same volumetric Fibonacci sphere, but rendered
       in ComPsych blues (deep navy → brand blue → sky) on the papercut background (no dark field), so
       the navy chrome/text stays. A soft light haze clears the center for the title/description/button. */
    .pdot2 { position: absolute; top: 50%; left: 50%; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%; will-change: transform; }
    .ps2-haze { position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(248,251,255,.95) 0px, rgba(248,251,255,.86) 64px, rgba(248,251,255,0) 205px); }

    /* Breath-visual picker (comparison shell) — a floating glass segmented control on Practice */
    .bvis-picker { position: fixed; top: 150px; left: 50%; transform: translateX(-50%); z-index: 6;
      width: max-content; display: flex; flex-direction: column; align-items: center; gap: 9px; }
    .bvis-label { font-size: var(--label-small-size); line-height: var(--label-small-lh); font-weight: 600;
      letter-spacing: .14em; text-transform: uppercase; color: var(--sys-primary-container); opacity: .5; }
    .frame.is-dark .bvis-label { color: rgba(255,255,255,.6); opacity: 1; }
    .bvis-seg { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 5px; border-radius: var(--radius-full);
      background: rgba(255,255,255,0.62); border: var(--stroke-thin) solid rgba(255,255,255,0.65);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(5,7,15,.12); }
    .bvis-btn { border: 0; background: transparent; cursor: pointer; height: 32px; padding: 0 16px; border-radius: var(--radius-full);
      font-family: var(--font-family); font-size: var(--label-medium-size); font-weight: 500;
      color: var(--sys-primary-container); opacity: .65; transition: background .15s, color .15s, opacity .15s; }
    .bvis-btn:hover { opacity: 1; background: rgba(7,15,54,.05); }
    .bvis-btn.on { background: var(--sys-primary); color: var(--sys-on-primary); opacity: 1; }
    .learn-num { display: flex; align-items: center; height: 52px; font-size: 48px; line-height: 1; font-weight: 500;
      letter-spacing: -0.02em; color: var(--sys-primary-container); font-variant-numeric: tabular-nums; }
    .learn-num svg { color: var(--sys-primary-container); }
    .learn-k { font-size: var(--label-medium-size); line-height: var(--label-medium-lh); font-weight: 600;
      letter-spacing: .12em; text-transform: uppercase; color: var(--sys-primary-container); opacity: .58; }
    .learn-copy { margin: 6px 0 0; font-size: var(--body-medium-size); line-height: var(--body-medium-lh);
      color: var(--sys-primary-container); opacity: .82; }

    /* ============================================================
       Solving the Problem (Immersion) — the Practice step is an INPUT flow rather than a breathing
       exercise, so it floats a frosted glass "workspace" on the papercut with an ambient glow behind
       it. Everything else (Intro/Learn/Reflect/Homework/Done) reuses the shared immersion classes.
       ============================================================ */
    .solve-ui .b2-center { align-self: stretch; }
    .solve-head { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 600px; margin: 0 auto; }
    /* cross-dissolve between the two Practice sub-stages (Define ↔ Brainstorm) */
    .solve-stage { display: flex; flex-direction: column; align-items: center; gap: 44px; width: 100%;
      transition: opacity .24s ease; }
    .solve-stage.in { opacity: 1; } .solve-stage.out { opacity: 0; }

    /* frosted glass workspace panel — the form sits on it so inputs stay legible over the papercut */
    .solve-panel { width: 100%; max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;
      padding: 30px 34px; border-radius: var(--radius-lg);
      background: rgba(255,255,255,0.55); border: var(--stroke-thin) solid rgba(255,255,255,0.65);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 18px 46px rgba(5,7,15,0.14); }
    /* the glass panel IS the field — the textarea blends into it (no nested box) */
    .solve-panel .sr-textarea { min-height: 120px; background: transparent; border: 0; padding: 0; box-shadow: none;
      resize: none; font-size: var(--body-large-size); line-height: var(--body-large-lh); }
    .solve-panel .sr-textarea:focus { border: 0; box-shadow: none; }
    /* the larger 20px field reads stronger at the same opacity, so fade it a touch more to match
       the 16px Brainstorm placeholders */
    .solve-panel .sr-textarea::placeholder { color: var(--sys-on-surface-variant); opacity: .4; }

    /* Brainstorm — the named problem recapped in the Utility "Your stressor" box (muted Card +
       ex-recap label), constrained to align with the idea rows below. */
    .solve-recap { width: 100%; max-width: 620px; margin: 0 auto; text-align: left; }
    .solve-lines { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 620px; margin: 0 auto; }
    /* each idea row is a full-width field with its number as a leading icon INSIDE the box, so every
       box (the "Your stressor" recap above + these three) shares the same left/right edges */
    .solve-line { position: relative; width: 100%;
      /* each idea row rises in after the head settles, staggered like the Learn cards */
      animation: learnCardIn 1s cubic-bezier(.16,1,.3,1) both; }
    .solve-line:nth-child(1) { animation-delay: .5s; }
    .solve-line:nth-child(2) { animation-delay: .68s; }
    .solve-line:nth-child(3) { animation-delay: .86s; }
    .solve-num { position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: var(--body-medium-size); font-weight: 400; font-variant-numeric: tabular-nums;
      color: var(--sys-primary); pointer-events: none; }
    .solve-line .sr-input { width: 100%; padding-left: 46px; text-align: left;
      background: rgba(255,255,255,0.92); border-color: rgba(255,255,255,0.7); }
    /* example prompts read as clearly optional hint text — DS placeholder color, softened */
    .solve-line .sr-input::placeholder { color: var(--sys-on-surface-variant); opacity: .5; }

    /* Homework — numbered badge in the selection-card lead slot */
    .opt-badge { width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center;
      justify-content: center; font-size: var(--label-large-size); font-weight: 600; font-variant-numeric: tabular-nums;
      background: var(--sys-primary-fixed-dim); color: var(--sys-primary); }
    .home-options .selcard.sel .opt-badge { background: var(--sys-primary); color: var(--sys-on-primary); }

    /* Ambient "ideas taking form" glow — soft, blurred brand orbs drifting behind the glass panel.
       On Brainstorm each orb brightens as its idea is written. Purely decorative (authored from
       scratch, not stock art); low-opacity + heavily blurred so the panel text always stays crisp. */
    .solve-amb { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .amb-blob { position: absolute; width: 340px; height: 340px; border-radius: 50%; filter: blur(66px);
      opacity: 0; transition: opacity 1s ease; will-change: transform; }
    .amb-blob.dim { opacity: .16; } .amb-blob.show { opacity: .5; }
    .amb-c  { width: 420px; height: 420px; left: calc(50% - 210px); top: calc(50% - 210px);
      background: radial-gradient(circle, rgba(90,150,255,.8), transparent 68%); animation: ambDrift1 18s ease-in-out infinite; }
    .amb-o0 { left: calc(50% - 360px); top: calc(50% - 120px);
      background: radial-gradient(circle, rgba(90,150,255,.85), transparent 68%); animation: ambDrift1 18s ease-in-out infinite; }
    .amb-o1 { left: calc(50% - 170px); top: calc(50% - 220px);
      background: radial-gradient(circle, rgba(110,205,230,.8), transparent 68%); animation: ambDrift2 22s ease-in-out infinite; }
    .amb-o2 { left: calc(50% + 30px); top: calc(50% - 90px);
      background: radial-gradient(circle, rgba(255,205,120,.72), transparent 68%); animation: ambDrift3 26s ease-in-out infinite; }
    @keyframes ambDrift1 { 0%,100% { transform: translate(-30px,-20px); } 50% { transform: translate(30px,26px); } }
    @keyframes ambDrift2 { 0%,100% { transform: translate(28px,-24px); } 50% { transform: translate(-26px,28px); } }
    @keyframes ambDrift3 { 0%,100% { transform: translate(-16px,30px); } 50% { transform: translate(22px,-28px); } }

    /* ---- Check-in (Immersion) — 1-5 pulse orbs + tiered response cards on the papercut ---- */
    .pls-ui .b2-center { gap: 30px; }
    .pls-scale { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 452px; margin: 0 auto; }
    .pls-row { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
    .pls-orb { width: 72px; height: 72px; flex: none; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.7); cursor: pointer;
      background: rgba(255,255,255,0.5); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      font-family: inherit; font-size: 26px; font-weight: 600; color: var(--sys-primary-container); font-variant-numeric: tabular-nums;
      box-shadow: 0 8px 22px rgba(5,7,15,.1);
      transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .25s, background .2s, color .2s, border-color .2s; }
    .pls-orb:hover { transform: scale(1.06); border-color: rgba(255,255,255,.95); }
    .pls-orb.sel { color: #fff; transform: scale(1.09); border-color: rgba(255,255,255,.9);
      box-shadow: 0 0 30px rgba(90,150,255,.35), 0 10px 26px rgba(5,7,15,.16); }
    .pls-ends { display: flex; justify-content: space-between; width: 100%; font-size: var(--label-small-size); color: var(--sys-primary-container); opacity: .6; }
    .pls-readout { min-height: 54px; display: flex; flex-direction: column; gap: 4px; align-items: center; text-align: center; }
    .pls-word { font-size: 24px; line-height: 1.2; font-weight: 600; transition: color .2s ease; }
    .pls-desc { font-size: var(--body-large-size); line-height: var(--body-large-lh); color: var(--sys-primary-container); opacity: .72; }
    .pls-reassure { margin: 6px auto 0; max-width: 520px; font-size: var(--label-medium-size); line-height: var(--label-medium-lh);
      color: var(--sys-primary-container); opacity: .6; text-align: center; }

    .scr-ui { overflow-y: auto; }
    .scr-ui .b2-center { justify-content: flex-start; }
    .scr-recap-pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: var(--radius-full);
      background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.65);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-size: var(--label-medium-size); font-weight: 600; }
    .scr-res { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 600px; margin: 0 auto; text-align: left; }
    .scr-res-card { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; padding: 22px 26px; border-radius: var(--radius-lg);
      background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.6);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 14px 40px rgba(5,7,15,.12); }
    .scr-res-card.primary { border-color: var(--sys-primary); box-shadow: 0 0 0 1.5px var(--sys-primary), 0 14px 40px rgba(5,7,15,.12); }
    .scr-res-name { font-size: var(--title-medium-size); line-height: var(--title-medium-lh); font-weight: 500; color: var(--sys-primary-container); }
    .scr-res-desc { margin: 0; font-size: var(--body-medium-size); line-height: var(--body-medium-lh); color: var(--sys-primary-container); opacity: .78; }

    .pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: var(--radius-full); background: var(--state-primary-08); color: var(--sys-primary); font-size: var(--label-small-size); font-weight: 600; }
    .medallion { width: 56px; height: 56px; border-radius: 50%; background: var(--state-primary-08); display: flex; align-items: center; justify-content: center; color: var(--sys-primary); }
    .medallion.solid { background: var(--sys-primary); color: var(--sys-on-primary); }
  </style>
</head>

/* ============================================================
 * Sunrise components — each maps to a published component.
 * ============================================================ */

// Component: Button
function Button({ variant = "filled", leadingIcon, trailingIcon, children, onClick, disabled }) {
  return (
    <button className={`sr-btn sr-btn--${variant}`} onClick={onClick} disabled={disabled}>
      {leadingIcon}{children}{trailingIcon}
    </button>
  );
}

// Component: Input Field
function InputField({ label, help, placeholder, multiline, rows = 4, value, onChange }) {
  return (
    <div className="sr-field">
      {label && <label className="sr-flabel">{label}</label>}
      {help && <span className="sr-fhelp">{help}</span>}
      {multiline
        ? <textarea className="sr-textarea" rows={rows} placeholder={placeholder} value={value} onChange={onChange} />
        : <input className="sr-input" placeholder={placeholder} value={value} onChange={onChange} />}
    </div>
  );
}

// Component: Divider
const Divider = () => <hr className="sr-divider" />;

// Component: Card
function Card({ muted, children, style }) {
  return <div className={"sr-card" + (muted ? " sr-card--muted" : "")} style={style}>{children}</div>;
}

// Component: Card Item / Style=Image — hero media card (branded gradient fill)
function HeroCard({ icon, title, subtitle, chip }) {
  return (
    <div className="herocard">
      <div className="hc-media" />
      <div className="hc-content">
        <div className="hc-top">
          <span className="hc-icon">{icon}</span>
          {chip && <span className="hc-chip">{chip}</span>}
        </div>
        <div className="hc-text">
          <p className="hc-title">{title}</p>
          {subtitle && <p className="hc-desc">{subtitle}</p>}
        </div>
      </div>
    </div>
  );
}

// Component: Selection Card (from Selection Card Group) — selectable row
function SelectionCard({ selected, leadingIcon, placeholder, text, onClick }) {
  const empty = !text || !text.trim();
  return (
    <button className={"selcard" + (selected ? " sel" : "")} onClick={onClick}>
      {leadingIcon && <span className="lead">{leadingIcon}</span>}
      <span className={"txt" + (empty ? " ph" : "")}>{empty ? placeholder : text}</span>
      <span className="check"><IcCheck size={14} /></span>
    </button>
  );
}

// Component: Progress Tracker — underline step-tabs
function ProgressTracker({ steps, current }) {
  return (
    <div className="ptrack">
      {steps.map((s, i) => (
        <div key={s.label} className={"ptab " + (i < current ? "done" : i === current ? "cur" : "")}>
          <span className="lbl">{s.label}</span>
          <span className="bar" />
        </div>
      ))}
    </div>
  );
}

function HeaderNav() {

}

    <>
      <Title eyebrow="Learn" title="Why the out-breath matters">

// Screen 3 — Core Exercise. The immersive breathing player: a pulsating orb
// paced to in-4 / out-6, with a two-minute session timer.

// Shared breathing state — so the App can render the BACKGROUND (color + ripple) and
// the FOREGROUND controls in separate DOM slots while sharing one paced timer.
function useBreath(active) {
  const IN = 4, OUT = 6, CYCLE = IN + OUT, TARGET = 120; // 2-minute session
  const [running, setRunning] = useState(false);
  const [tick, setTick] = useState(0);

  // Timer only advances while the Practice step is active — so leaving Practice freezes
  // the breath (no background ticking, and no color flash during the dissolve-out).
  React.useEffect(() => {
    if (!running || !active) return;
    const id = setInterval(() => {
      setTick(t => {
        const nt = t + 1;
        if (nt >= TARGET) { setRunning(false); return TARGET; }
        return nt;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [running, active]);

  const started = running || tick > 0;
  const done = tick >= TARGET;
  const pos = tick % CYCLE;
  const activePhase = pos < IN ? "in" : "out";
  const phase = done ? "done" : !started ? "ready" : running ? activePhase : "paused";
  const scale = !started ? 0.55 : activePhase === "in" ? 1 : 0.5;
  const dur = activePhase === "in" ? IN : OUT;
  const remaining = Math.max(TARGET - tick, 0);
  const mmss = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  const phaseWord = done ? "Nicely done"
    : phase === "in" ? "Inhale"
    : phase === "out" ? "Exhale"
    : phase === "paused" ? "Paused"
    : "Ready when you are";
  const onPlay = () => { if (done) { setTick(0); setRunning(true); } else setRunning(r => !r); };

  return { running, done, phase, scale, dur, timeText: mmss(remaining), phaseWord, onPlay };
}

// (Practice) the two wave layers rise/settle with the breath.
function BreathBackground({ warmth = 0, breath = null }) {
  const skyTop = _ramp("#B9DCFF", "#FFF58C", warmth); // sky: blue → sun yellow
  const wave   = _ramp("#BADCFF", "#F6DE84", warmth); // papercut waves: blue → warm gold
  const breathing = !!breath;
  const inhale = breathing && breath.phase === "in";
  const dur = breathing ? breath.dur : 6;
  const ease = "cubic-bezier(.37,0,.63,1)";
  const base = { transformBox: "view-box", transformOrigin: "960px 1080px", transition: "transform " + dur + "s " + ease };
  // waves swell + rise on the in-breath, settle on the out-breath (parallax: front rises more)
  const w1 = { ...base, transform: inhale ? "translateY(-58px) scaleY(1.065)" : "translateY(0px) scaleY(1)" };
  const w2 = { ...base, transform: inhale ? "translateY(-30px) scaleY(1.035)" : "translateY(0px) scaleY(1)" };
  return (
    <div className="breathe2">
      <svg className="paper-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="pcp0" x1="1953" y1="540" x2="0" y2="576.5" gradientUnits="userSpaceOnUse">
            <stop stopColor={skyTop} /><stop offset="1" stopColor="#FFF2EB" />
          </linearGradient>
          <linearGradient id="pcp1" x1="1080.5" y1="167.5" x2="797.372" y2="699.405" gradientUnits="userSpaceOnUse">
            <stop offset="0.15" stopColor={wave} stopOpacity="0" /><stop offset="0.85" stopColor={wave} />
          </linearGradient>
          <linearGradient id="pcp2" x1="1028.5" y1="1473" x2="2191.78" y2="626.261" gradientUnits="userSpaceOnUse">
            <stop offset="0.15" stopColor={wave} stopOpacity="0" /><stop offset="0.85" stopColor={wave} />
          </linearGradient>
        </defs>
        <rect width="1920" height="1080" fill="#F2F1E6" />
        <rect width="1920" height="1080" fill="url(#pcp0)" />
        <g style={w1}><g className="wave-drift-1"><path d={WAVE1_D} fill="url(#pcp1)" fillOpacity="0.9" /></g></g>
        <g style={w2}><g className="wave-drift-2"><path d={WAVE2_D} fill="url(#pcp2)" fillOpacity="0.9" /></g></g>
      </svg>
    </div>
  );
}

// Foreground: phase text, timer and the play/pause control (no ambience picker in Concept 3).
function BreathControls({ breath }) {
  return (
    <div className={"breath-ui breath-practice is-" + breath.phase}>
      {/* time, title, description and control all centered together — the breath graphic
          expands and contracts around this cluster. */}
      <div className="bp-hero">
        <span className="b2-time">{breath.timeText}</span>
        <span className="b2-phase">{breath.phaseWord}</span>
        <p className="b2-sub">Let the exhale be longer than the inhale.</p>
        <Button variant="filled"
          leadingIcon={breath.done ? <IcRepeat size={18} /> : breath.running ? <IcPause size={18} /> : <IcPlay size={18} />}
          onClick={breath.onPlay}>

        </Button>
      </div>
    </div>
  );
}

// --- Breath visuals (Concept 3): selectable, calming breathing animations -------------------
// Shared target: how "open" the visual is (in→1, out→0, small at rest) and the transition
// duration paced to the current phase, so every visual breathes with the 4s/6s timer.
function _bt(breath) {
  const p = breath.phase;
  const open = p === "in" ? 1 : p === "out" ? 0 : p === "done" ? 0.55 : 0.12;
  const active = p === "in" || p === "out";
  const dur = active ? breath.dur : 0.9;
  const ease = "cubic-bezier(.37,0,.63,1)";
  return { open, dur, tr: `transform ${dur}s ${ease}, opacity ${dur}s ${ease}` };
}

// Aura — a luminous layered orb that brightens + expands on the in-breath.
function VisAura({ breath }) {
  const { open, tr } = _bt(breath);
  const s = 0.74 + open * 0.46, g = 0.55 + open * 0.45;
  const layer = (cls, sc, op) => <div className={"aura-l " + cls} style={{ transform: `scale(${sc})`, opacity: op, transition: tr }} />;
  return <div className="vis">{layer("aura-out", s * 1.35, g * 0.42)}{layer("aura-mid", s * 1.15, g * 0.7)}{layer("aura-core", s, g)}</div>;
}

// Ripple — concentric rings that scale with the breath, over a gentle constant emanation.
function VisRipple({ breath }) {
  const { open, tr } = _bt(breath);
  const s = 0.72 + open * 0.5;
  return (
    <div className="vis">
      <span className="rip-pulse" /><span className="rip-pulse d2" />
      <div className="rip-wrap" style={{ transform: `scale(${s})`, transition: tr }}>
        <span className="rip r4" /><span className="rip r3" /><span className="rip r2" /><span className="rip r1" />
        <span className="rip-core" />
      </div>
    </div>
  );
}

// Bloom — a radial mandala whose petals open on the in-breath. Petals are anchored to the center
// and placed with a translate/rotate that stays robust under the layer's scale.
function VisBloom({ breath }) {
  const { open, tr } = _bt(breath);
  const N = 8, spread = 72 + open * 66, ps = 0.8 + open * 0.42;
  return (
    <div className="vis">
      {Array.from({ length: N }).map((_, i) => (
        <span key={i} className="petal"
          style={{ transform: `translate(-50%,-50%) rotate(${i * (360 / N) + open * 20}deg) translateY(-${spread}px) scale(${ps})`, transition: tr }} />
      ))}
      <span className="bloom-core" style={{ transform: `translate(-50%,-50%) scale(${0.75 + open * 0.5})`, transition: tr }} />
    </div>
  );
}

// Aurora — soft drifting mesh-gradient clouds that swell with the breath.
function VisAurora({ breath }) {
  const { open, dur, tr } = _bt(breath);
  const s = 0.85 + open * 0.4, op = 0.62 + open * 0.38;
  return (
    <div className="vis" style={{ opacity: op, transition: `opacity ${dur}s ease` }}>
      <div className="aur-blob b1" style={{ transform: `scale(${s})`, transition: tr }} />
      <div className="aur-blob b2" style={{ transform: `scale(${s * 1.12})`, transition: tr }} />
      <div className="aur-blob b3" style={{ transform: `scale(${s * 0.9})`, transition: tr }} />
    </div>
  );
}

// Orbit — a constellation ring that expands on the in-breath, with a gentle twinkle. Dots are
// anchored to center and placed by trig translate (no fragile rotate-in-a-zero-box pattern).
function VisOrbit({ breath }) {
  const { open, tr } = _bt(breath);
  const N = 12, radius = 112 + open * 84, ds = 0.85 + open * 0.5, spin = open * 0.5;
  return (
    <div className="vis">
      {Array.from({ length: N }).map((_, i) => {
        const a = (i / N) * 2 * Math.PI - Math.PI / 2 + spin;
        const x = Math.cos(a) * radius, y = Math.sin(a) * radius;
        return <span key={i} className="odot"
          style={{ transform: `translate(-50%,-50%) translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${ds})`, transition: tr }} />;
      })}
      <span className="orbit-core" style={{ transform: `translate(-50%,-50%) scale(${0.7 + open * 0.5})`, transition: tr }} />
    </div>
  );
}

  const R = 148 + open * 66, N = 172;
  const pts = React.useMemo(() => {
    const arr = [], ga = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < N; i++) {
      const y = 1 - (i / (N - 1)) * 2;
      const r = Math.sqrt(Math.max(0, 1 - y * y));
      const th = i * ga;
      arr.push({ x: Math.cos(th) * r, y, z: Math.sin(th) * r });
    }
    return arr;
  }, []);
  return (
    <div className="vis ps-perspective">
      <div className="ps-spin">
        {pts.map((p, i) => {
          const blue = p.x >= 0;
          return <span key={i} className="pdot" style={{
            transform: `translate3d(${(p.x * R).toFixed(1)}px, ${(p.y * R).toFixed(1)}px, ${(p.z * R).toFixed(1)}px)`,
            background: blue ? "radial-gradient(circle,#bcd6ff,#3b7ae0)" : "radial-gradient(circle,#f4b0f2,#c93bd6)",
            boxShadow: blue ? "0 0 9px rgba(90,150,255,.7)" : "0 0 9px rgba(220,90,220,.7)",
            transition: tr,
          }} />;
        })}
      </div>
      {/* fade the central particles so they don't overlay the title/description/button */}
      <div className="ps-fog" />
    </div>
  );
}

// Particles 2 — light-mode, on-brand variant. Lives on the papercut background; particles run a
// vertical brand gradient (sky at the top → deep navy at the base) with a soft glossy bead highlight.
function VisParticles2({ breath }) {
  const { open, tr } = _bt(breath);
  const R = 148 + open * 66, N = 172;
  const pts = React.useMemo(() => {
    const arr = [], ga = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < N; i++) {
      const y = 1 - (i / (N - 1)) * 2;
      const r = Math.sqrt(Math.max(0, 1 - y * y));
      const th = i * ga;
      arr.push({ x: Math.cos(th) * r, y, z: Math.sin(th) * r });
    }
    return arr;
  }, []);
  return (
    <div className="vis ps-perspective">
      <div className="ps-spin">
        {pts.map((p, i) => {
          // Brand duotone — one hemisphere ComPsych blue, the other brand gold/orange. The two hues
          // are never blended through gray (which reads muddy/brown); instead they meet through a
          // luminous seam (lightness lift within each hue), Apple-style. Top dots run a touch
          // brighter for volume, so the sphere reads dimensional as it spins.
          const az = Math.atan2(p.z, p.x);   // -π..π around the sphere
          const side = Math.cos(az);          // >0 warm side, <0 cool side
          const warm = side > 0;
          const lift = (p.y + 1) / 2;         // 0 at base → 1 at crown
          const h = warm ? 34 : 212;          // brand gold  /  ComPsych blue
          const s = warm ? 92 : 90;
          const seam = 1 - Math.min(1, Math.abs(side) / 0.22); // 0..1 near the meeting line
          const l = (warm ? 54 + lift * 13 : 52 + lift * 15) + seam * 16;
          const col = `hsl(${h}, ${s}%, ${l.toFixed(0)}%)`;
          const hl = `hsl(${h}, 100%, ${Math.min(95, l + 22).toFixed(0)}%)`;
          return <span key={i} className="pdot2" style={{
            transform: `translate3d(${(p.x * R).toFixed(1)}px, ${(p.y * R).toFixed(1)}px, ${(p.z * R).toFixed(1)}px)`,
            background: `radial-gradient(circle at 34% 30%, ${hl}, ${col})`,
            boxShadow: `0 0 10px hsla(${h}, 96%, 60%, .5)`,
            transition: tr,
          }} />;
        })}
      </div>
      {/* clear the center so the navy title/description/button stay legible on the light field */}
      <div className="ps2-haze" />
    </div>
  );
}

/* A single mood face — expression + color warm up from tense (0) to calm (n-1). */
function MoodFace({ level, n, t: tProp, size = 54 }) {
  const t = tProp != null ? tProp : (n > 1 ? level / (n - 1) : 0.5);
  const lerp = (a, b) => Math.round(a + (b - a) * t);
  // color tracks the papercut: blue at rest (on the blue papercut) → warm yellow as you slide to calm
  const color = `rgb(${lerp(111, 255)}, ${lerp(168, 202)}, ${lerp(232, 78)})`;
  const curve = t * 10;                                                        // mouth: flat → smile (never a frown)
  return (
    <svg width={size} height={size} viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="22" fill={color} />
      <circle cx="17.5" cy="20" r="2.6" fill="#37342f" />
      <circle cx="30.5" cy="20" r="2.6" fill="#37342f" />
      <path d={`M16 30 Q24 ${30 + curve} 32 30`} stroke="#37342f" strokeWidth="2.6" fill="none" strokeLinecap="round" />
    </svg>
  );
}

const STEPS = [

  { key: "pulse",    label: "Check-in", slug: "pulse" },
  { key: "response", label: "For you",  slug: "response" },

const LEVELS = [
  { n: 1, word: "Calm",          desc: "Barely a ripple this week.", color: "#4F9DE8" },
  { n: 2, word: "Mostly okay",   desc: "A few bumps, nothing big.",  color: "#59B0C0" },
  { n: 3, word: "Some pressure", desc: "Noticeable, but managing.",  color: "#E2C069" },
