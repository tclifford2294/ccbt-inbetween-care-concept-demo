<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CCBT · Grounding (immersive) — Sunrise prototype</title>
  <style>
    /*
     * Material Sunrise — design tokens (inlined so this file is self-contained).
     * Extracted live from the Sunrise Figma files (Foundation & Tokens) and from
     * the GuidanceResources WIP file (Yfpcl4M7hiKSqdzgZBRmDt) on 2026-07-16.
     * Every value maps 1:1 to a Sunrise variable name. Reference these custom
     * properties only — no raw literals in component code. Mirrored in tokens.css.
     * Identical to concept-2.html so both modules share one framework + timing.
     */
    :root {
      /* color roles — accent */
      --sys-primary:            #075cba;
      --sys-on-primary:         #ffffff;
      --sys-primary-container:  #070f36;
      --sys-primary-fixed-dim:  #e3f2fd;
      --sys-tertiary:           #ffffff;

      /* color roles — surface */
      --sys-surface:                    #f3f4f6;
      --sys-surface-container-lowest:   #ffffff;
      --sys-surface-container:          #f3f4f6;
      --sys-surface-container-high:     #eceeef;
      --sys-surface-container-highest:  #e6e8ea;
      --sys-on-surface:                 #1b1d22;
      --sys-on-surface-variant:         #565f6c;

      /* color roles — outline */
      --sys-outline:          #ebecf0;
      --sys-outline-variant:  #d7dbe0;

      /* color roles — custom / status */
      --sys-info:             #226cee;
      --sys-success:          #278647;
      --sys-error:            #d82727;
      --sys-error-container:  #f7d4d4;

      /* color roles — inverse */
      --sys-inverse-on-surface: #ffffff;

      /* color roles — transparent */
      --sys-primary-20:  rgba(7, 92, 186, 0.08);
      --sys-white-80:    rgba(255,255,255,0.80);
      --sys-white-50:    rgba(255,255,255,0.50);
      --sys-black-50:    rgba(0,0,0,0.50);

      /* typography — family (Google Sans is the Sunrise brand face) */
      --font-family: "Google Sans", "Google Sans Text", "Product Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

      /* type scale (size / line-height / tracking / weight) */
      --headline-medium-size: 40px;  --headline-medium-lh: 48px;
      --headline-small-size: 32px;   --headline-small-lh: 38.4px;
      --title-medium-size: 24px;     --title-medium-lh: 31.2px;    --title-medium-weight: 500;
      --body-large-size: 20px;       --body-large-lh: 30px;
      --body-medium-size: 16px;      --body-medium-lh: 24px;
      --body-small-size: 14px;       --body-small-lh: 20px;
      --label-large-size: 16px;      --label-large-lh: 22.4px;     --label-large-weight: 500;
      --label-medium-size: 14px;     --label-medium-lh: 20px;      --label-medium-track: 0.07px;
      --label-small-size: 12px;      --label-small-lh: 18px;       --label-small-weight: 500; --label-small-track: 0.12px;

      /* shape / radius */
      --radius-sm:   8px;
      --radius-md:   12px;
      --radius-lg:   16px;
      --radius-full: 999px;

      /* spacing / padding scale */
      --pad-2: 2px;  --pad-4: 4px;   --pad-8: 8px;   --pad-12: 12px;
      --pad-16: 16px; --pad-20: 20px; --pad-24: 24px; --pad-32: 32px;
      --pad-40: 40px; --pad-48: 48px;

      /* stroke */
      --stroke-thin: 1px;
      --stroke-medium: 1.5px;

      /* elevation */
      --elev-1: 0 2px 8px rgba(0,0,0,0.04), 0 2px 4px rgba(0,0,0,0.06);
      --elev-2: 0 4px 16px rgba(0,0,0,0.10), 0 2px 4px rgba(0,0,0,0.08);

      /* M3 state-layer tints derived from the resolved roles above */
      --state-primary-08:     rgba(7, 92, 186, 0.08);
      --state-on-surface-04:  rgba(27, 29, 34, 0.04);
      --state-on-surface-08:  rgba(27, 29, 34, 0.08);
      --state-error-08:       rgba(216, 39, 39, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--sys-surface); }
    body {
      font-family: var(--font-family);
      color: var(--sys-on-surface);
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; cursor: pointer; }
    input, textarea { font-family: inherit; }
    a { color: var(--sys-primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ---- app frame (no browser chrome) ---- */
    .frame { position: relative; display: flex; flex-direction: column; min-height: 100vh; background: var(--sys-surface); }
    .screen { position: relative; z-index: 1; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }

    /* ---- prototype step navigator (a review control, not part of the app) ---- */
    .stepnav { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 16px; padding: 12px; color: var(--sys-on-surface-variant); font-size: 13px; background: var(--sys-surface); border-top: var(--stroke-thin) solid var(--sys-outline); }
    .stepnav button { background: var(--sys-surface-container-lowest); color: var(--sys-on-surface); border: 1px solid var(--sys-outline-variant); border-radius: var(--radius-full); height: 32px; padding: 0 14px; font-size: 13px; }
    .stepnav button:disabled { opacity: .4; cursor: default; }
    .dots { display: flex; gap: 7px; }
    .dots b { width: 8px; height: 8px; border-radius: 50%; background: var(--sys-outline-variant); display: block; cursor: pointer; }
    .dots b.on { background: var(--sys-primary); }

    /* ---- Sunrise type primitives ---- */
    .sr-headline-m { font-size: var(--headline-medium-size); line-height: var(--headline-medium-lh); font-weight: 400; margin: 0; }
    .sr-headline-s { font-size: var(--headline-small-size); line-height: var(--headline-small-lh); font-weight: 400; margin: 0; }
    .sr-body-m { font-size: var(--body-medium-size); line-height: var(--body-medium-lh); font-weight: 400; }
    .sr-label-l { font-size: var(--label-large-size); line-height: var(--label-large-lh); font-weight: var(--label-large-weight); }
    .sr-label-m { font-size: var(--label-medium-size); line-height: var(--label-medium-lh); font-weight: 400; letter-spacing: var(--label-medium-track); }
    .eyebrow { font-size: var(--label-small-size); line-height: var(--label-small-lh); font-weight: var(--label-small-weight); letter-spacing: .06em; text-transform: uppercase; color: var(--sys-primary); }

    /* ---- Sunrise: Header Navigation ---- */
    .navbar { height: 64px; background: var(--sys-surface-container-lowest); border-bottom: var(--stroke-thin) solid var(--sys-outline); display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 12px; }
    .nav-left { display: flex; align-items: center; gap: var(--pad-4); }
    .nav-right { display: flex; align-items: center; gap: var(--pad-12); }
    .icon-buttons { display: flex; align-items: center; gap: var(--pad-8); }
    .nav-item { width: 40px; height: 40px; border-radius: var(--radius-full); background: transparent; border: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--sys-on-surface); position: relative; }
    .nav-item:hover { background: var(--state-on-surface-04); }
    .brandmark { display: inline-flex; align-items: center; }
    .badge { position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: var(--radius-full); background: var(--sys-primary); color: var(--sys-on-primary); font-size: var(--label-small-size); font-weight: var(--label-small-weight); border: var(--stroke-thin) solid var(--sys-surface-container-lowest); display: inline-flex; align-items: center; justify-content: center; }
    .nav-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--sys-primary-fixed-dim); color: var(--sys-primary); border: var(--stroke-thin) solid var(--sys-primary-20); display: inline-flex; align-items: center; justify-content: center; font-size: var(--label-small-size); font-weight: var(--label-small-weight); }
    .crumbs { display: flex; align-items: center; font-size: var(--label-medium-size); letter-spacing: var(--label-medium-track); }
    .crumbs .crumb { padding: 2px 8px; display: inline-flex; align-items: center; }
    .crumbs .sep { color: var(--sys-on-surface-variant); }
    .crumbs .c-muted { color: var(--sys-on-surface-variant); }
    .crumbs .c-cur { color: var(--sys-on-surface); }
    .emergency { height: 40px; border-radius: var(--radius-full); background: var(--sys-surface-container-lowest); border: var(--stroke-thin) solid var(--sys-error); color: var(--sys-error); display: inline-flex; align-items: center; gap: 8px; padding: 0 16px 0 10px; font-size: var(--label-medium-size); font-weight: 500; white-space: nowrap; }
    .emergency:hover { background: var(--state-error-08); }
    .emergency .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--sys-error); color: #fff; display: inline-flex; align-items: center; justify-content: center; }

    /* ---- Sunrise: Content Section Template (the white card shell) ---- */
    .app { flex: 1; min-height: 0; background: var(--sys-surface); display: flex; flex-direction: column; }
    .section-wrap { flex: 1; min-height: 0; padding: 16px; display: flex; }
    .section-card { position: relative; flex: 1; min-height: 0; background: var(--sys-surface-container-lowest); border-radius: var(--radius-lg); box-shadow: var(--elev-1); display: flex; flex-direction: column; overflow: hidden; }
    .section-progress { position: relative; z-index: 1; padding: 28px 32px 4px; }
    .section-body { position: relative; z-index: 1; flex: 1; min-height: 0; padding: 20px 32px; display: flex; justify-content: center; overflow: auto; }
    .col { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: var(--pad-40); }

    /* immersive sub-flow — cross-dissolve between sub-steps (shared timing) */
    .ex-stage { display: flex; flex-direction: column; gap: var(--pad-40); transition: opacity 220ms ease; }
    .ex-stage.in  { opacity: 1; }
    .ex-stage.out { opacity: 0; }
    /* staggered entrance applied to every step's content blocks — identical timing to concept-2 */
    @keyframes revealIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .col > *:not(.ex-stage), .ex-stage > * { animation: revealIn .7s ease both; }
    .col > *:not(.ex-stage):nth-child(1), .ex-stage > *:nth-child(1) { animation-delay: 0s; }
    .col > *:not(.ex-stage):nth-child(2), .ex-stage > *:nth-child(2) { animation-delay: .55s; }
    .col > *:not(.ex-stage):nth-child(3), .ex-stage > *:nth-child(3) { animation-delay: 1.25s; }
    .col > *:not(.ex-stage):nth-child(4), .ex-stage > *:nth-child(4) { animation-delay: 1.95s; }
    .col > *:not(.ex-stage):nth-child(5), .ex-stage > *:nth-child(5) { animation-delay: 2.65s; }
    /* Intro / Learn / Done: whole content fades in together (no stagger) */
    .col--whole { animation: revealIn .7s ease both; }
    .col--whole > * { animation: none !important; }
    /* leaving a step: the whole card content fades + drops off-screen to make room */
    .col--leaving, .col--leaving.col--whole { animation: colLeave .45s cubic-bezier(.4,0,1,1) both !important; }
    .col--leaving > * { animation: none !important; }
    @keyframes colLeave { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(56px); } }
    .ex-recap { display: flex; flex-direction: column; gap: 6px; }
    .ex-recap .k { font-size: var(--label-small-size); line-height: var(--label-small-lh); font-weight: var(--label-small-weight); letter-spacing: .06em; text-transform: uppercase; color: var(--sys-on-surface-variant); }
    .section-actions { position: relative; z-index: 1; border-top: var(--stroke-thin) solid var(--sys-outline); padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .actions-help { color: var(--sys-on-surface-variant); font-size: var(--label-medium-size); }

    /* ---- Sunrise: Progress Tracker (underline step-tabs) ---- */
    .ptrack { display: flex; gap: 8px; max-width: 860px; margin: 0 auto; }
    .ptab { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; background: transparent; border: 0; padding: 0; text-align: left; }
    .ptab .lbl { font-size: var(--label-medium-size); line-height: var(--label-medium-lh); color: var(--sys-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ptab.done .lbl, .ptab.cur .lbl { color: var(--sys-on-surface); font-weight: 500; }
    .ptab .bar { height: 3px; border-radius: var(--radius-full); background: var(--sys-outline-variant); }
    .ptab.done .bar, .ptab.cur .bar { background: var(--sys-success); }

    /* ---- Sunrise: Button ---- */
    .sr-btn { height: 48px; border-radius: var(--radius-full); padding: 0 24px; font-size: var(--label-large-size); line-height: var(--label-large-lh); font-weight: var(--label-large-weight); display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: var(--stroke-thin) solid transparent; transition: filter .12s, background .12s; }
    .sr-btn--filled { background: var(--sys-primary); color: var(--sys-on-primary); }
    .sr-btn--filled:hover { filter: brightness(1.08); }
    .sr-btn--filled:disabled { background: var(--sys-surface-container-high); color: var(--sys-on-surface-variant); cursor: default; filter: none; }
    .sr-btn--outlined { background: var(--sys-surface-container-lowest); color: var(--sys-on-surface); border-color: var(--sys-outline-variant); }
    .sr-btn--outlined:hover { background: var(--state-on-surface-04); }
    .sr-btn--text { background: transparent; color: var(--sys-primary); height: 44px; padding: 0 12px; }
    .sr-btn--text:hover { background: var(--state-primary-08); }
    .sr-btn--tonal { background: var(--sys-primary-fixed-dim); color: var(--sys-primary); }
    .sr-btn--tonal:hover { filter: brightness(0.97); }

    /* ---- Sunrise: Input Field ---- */
    .sr-field { display: flex; flex-direction: column; gap: 8px; }
    .sr-flabel { display: flex; gap: 4px; align-items: center; font-size: var(--body-medium-size); line-height: var(--body-medium-lh); font-weight: 500; color: var(--sys-on-surface); }
    .sr-fhelp { font-size: var(--label-medium-size); line-height: var(--label-medium-lh); color: var(--sys-on-surface-variant); }
    .sr-input, .sr-textarea { width: 100%; border-radius: var(--radius-md); border: var(--stroke-thin) solid var(--sys-outline-variant); background: var(--sys-surface-container-lowest); padding: 14px 16px; font-size: var(--body-medium-size); line-height: var(--body-medium-lh); color: var(--sys-on-surface); outline: none; transition: border-color .12s, box-shadow .12s; }
    .sr-input { height: 56px; padding: 0 16px; }
    .sr-textarea { resize: vertical; min-height: 88px; }
    .sr-input::placeholder, .sr-textarea::placeholder { color: var(--sys-on-surface-variant); }
    .sr-input:focus, .sr-textarea:focus { border-color: var(--sys-primary); box-shadow: 0 0 0 1px var(--sys-primary); }

    /* ---- Sunrise: Divider ---- */
    .sr-divider { height: 1px; background: var(--sys-outline); border: 0; width: 100%; margin: 0; }

    /* ---- Sunrise: Card ---- */
    .sr-card { background: var(--sys-surface-container-lowest); border-radius: var(--radius-lg); border: 1px solid var(--sys-outline); box-shadow: var(--elev-1); padding: var(--pad-24); }
    .sr-card--muted { background: var(--sys-surface-container); border: 0; box-shadow: none; }

    /* ---- Sunrise: Card Item / Style=Image (hero media card, node 1340:17442) ---- */
    .herocard { position: relative; width: 100%; min-height: 156px; border-radius: var(--radius-lg); overflow: hidden;
      background: linear-gradient(135deg, var(--sys-primary-container) 0%, var(--sys-primary) 150%); }
    .herocard .hc-media { position: absolute; inset: 0; background-image: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.12) 40%, rgba(0,0,0,0.12) 60%, rgba(0,0,0,0.4) 100%); mix-blend-mode: multiply; pointer-events: none; }
    .herocard .hc-content { position: relative; min-height: 156px; padding: var(--pad-16); display: flex; flex-direction: column; justify-content: space-between; gap: var(--pad-24); }
    .herocard .hc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; width: 100%; }
    .herocard .hc-icon { width: 32px; height: 32px; flex: none; color: var(--sys-inverse-on-surface); display: inline-flex; }
    .herocard .hc-text { display: flex; flex-direction: column; gap: var(--pad-2); }
    .herocard .hc-title { font-size: var(--body-large-size); line-height: var(--body-large-lh); font-weight: 400; color: var(--sys-inverse-on-surface); margin: 0; }
    .herocard .hc-desc { font-size: var(--body-small-size); line-height: var(--body-small-lh); color: var(--sys-white-80); }
    .herocard .hc-chip { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: var(--radius-full); background: rgba(255,255,255,0.14); color: var(--sys-inverse-on-surface); font-size: var(--label-small-size); font-weight: var(--label-small-weight); white-space: nowrap; }

    /* ---- Sunrise: Selection Card (selectable row) ---- */
    .selcard { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--sys-surface-container-lowest); border: var(--stroke-thin) solid var(--sys-outline-variant); border-radius: var(--radius-md); padding: 16px 18px; min-height: 56px; transition: background .12s, border-color .12s, box-shadow .12s; }
    .selcard:hover { background: var(--state-on-surface-04); }
    .selcard.sel { border-color: var(--sys-primary); border-width: var(--stroke-medium); background: var(--sys-primary-20); }
    .selcard .lead { color: var(--sys-on-surface-variant); display: inline-flex; }
    .selcard.sel .lead { color: var(--sys-primary); }
    .selcard .txt { flex: 1; font-size: var(--body-medium-size); line-height: var(--body-medium-lh); color: var(--sys-on-surface); }
    .selcard .txt.ph { color: var(--sys-on-surface-variant); }
    .selcard .check { width: 22px; height: 22px; flex: none; border-radius: 6px; border: 2px solid var(--sys-outline-variant); display: inline-flex; align-items: center; justify-content: center; color: transparent; }
    .selcard.sel .check { background: var(--sys-primary); border-color: var(--sys-primary); color: #fff; }

    /* ---- "An example" broken into step boxes (per Option Card style) ---- */
    .ex-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 12px; }
    .ex-grid--3 { grid-template-columns: repeat(3, 1fr); }
    .ex-grid--5 { grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .ex-box { display: flex; flex-direction: column; justify-content: flex-start; gap: var(--pad-24); min-height: 208px;
      background: var(--sys-surface-container-lowest); border: var(--stroke-thin) solid var(--sys-outline-variant);
      border-radius: var(--radius-md); padding: 18px; }
    .ex-box .ex-top { display: flex; align-items: flex-start; justify-content: space-between; }
    .ex-box .ex-chip { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--sys-surface-container-high);
      color: var(--sys-on-surface); display: inline-flex; align-items: center; justify-content: center; }
    .ex-box .ex-info { color: var(--sys-on-surface-variant); display: inline-flex; }
    .ex-box .ex-text { display: flex; flex-direction: column; gap: 4px; }
    .ex-box .ex-sub { font-size: var(--label-small-size); line-height: var(--label-small-lh); font-weight: var(--label-small-weight); color: var(--sys-on-surface-variant); }
    .ex-box .ex-copy { margin: 0; font-size: var(--body-medium-size); line-height: var(--body-medium-lh); color: var(--sys-on-surface); }
    /* Learn "pattern" cards — big 4 / 6 / repeat numerals (mirrors the Immersion variant, on light surface) */
    .learn-box { justify-content: flex-start; gap: 8px; min-height: 0; }
    .learn-num { display: flex; align-items: center; height: 32px; font-size: 32px; line-height: 1; font-weight: 500;
      letter-spacing: -0.02em; color: var(--sys-primary); font-variant-numeric: tabular-nums; }
    .learn-num svg { color: var(--sys-primary); }
    .learn-k { font-size: var(--label-medium-size); line-height: var(--label-medium-lh); font-weight: 600;
      letter-spacing: .12em; text-transform: uppercase; color: var(--sys-on-surface-variant); }
    .learn-copy { margin: 6px 0 0; font-size: var(--body-medium-size); line-height: var(--body-medium-lh); color: var(--sys-on-surface); }

    /* ---- NonSystem breathing player ----
     * The breathing lives in a PERSISTENT full-screen layer that sits behind the app.
     * On the Practice step it dissolves IN; on leaving Practice it dissolves OUT. The
     * nav / progress / footer stay mounted on top of it the whole time. ---- */
    /* Entering Practice is a SLOW, immersive fade-in (asymmetric: ~1.6s in, quicker out). */
    .practice-bg-layer { position: fixed; inset: 0; z-index: 0; overflow: hidden;
      opacity: 0; pointer-events: none; transition: opacity .55s ease; }
    .frame.is-practice .practice-bg-layer { opacity: 1; pointer-events: auto; transition: opacity 1.6s ease; }

    /* the color field gently zoom-settles as it fades in, drawing the user inward */
    .breathe2 { position: absolute; inset: 0; overflow: hidden; transform: scale(1.09);
      transition: transform .6s ease, background-color .9s ease; }
    .frame.is-practice .breathe2 { transform: scale(1);
      transition: transform 2.3s cubic-bezier(.16,1,.3,1), background-color .9s ease; }
    /* a subtle light ramp: starts at the "ready" blue (#e3f2fd) and deepens just slightly across the
       five senses — staying far lighter than the old Well Done blue. Well Done matches the last sense. */
    .breathe2.tone-ready  { background: var(--sys-primary-fixed-dim); } /* #e3f2fd */
    .breathe2.tone-see    { background: #dceffc; }
    .breathe2.tone-hear   { background: #d5ecfc; }
    .breathe2.tone-feel   { background: #cee8fb; }
    .breathe2.tone-smell  { background: #c7e5fb; }
    .breathe2.tone-taste,
    .breathe2.tone-celebrate { background: #c0e1fa; } /* Well Done matches the last sense screen */

    /* concentric ripple — translucent circles that scale with the breath */
    .b2-orb { position: absolute; top: 50%; left: 50%; width: 340px; height: 340px;
      transform: translate(-50%, -50%) scale(0.55); transition: transform 4s ease-in-out, opacity .5s ease;
      opacity: 0; will-change: transform; pointer-events: none; }
    .breathe2.is-in .b2-orb, .breathe2.is-out .b2-orb { opacity: 1; }
    .b2-ring { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.07); }
    .b2-ring.a { inset: 0; } .b2-ring.b { inset: 12%; } .b2-ring.c { inset: 26%; }
    .b2-ring.d { inset: 40%; background: rgba(255,255,255,0.10); }

    /* foreground controls — inset so they clear the nav (top) and footer/stepnav (bottom) */
    .breath-ui { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 140px 24px 150px; transition: color .9s ease; }
    /* controls arrive AFTER the environment establishes — fade + drift up, delayed */
    .frame.is-practice .breath-ui { animation: breathUiIn 1.5s cubic-bezier(.16,1,.3,1) .5s both; }
    @keyframes breathUiIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    .breath-ui.is-in, .breath-ui.is-out { color: var(--sys-on-primary); }
    .breath-ui.is-paused, .breath-ui.is-ready, .breath-ui.is-done { color: var(--sys-primary-container); }

    /* lower the ambience pill so it clears the progress tracker on typical viewports */
    .b2-top { padding-top: 48px; }
    .b2-ambience { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px;
      border-radius: var(--radius-full); border: 1px solid transparent; background: rgba(255,255,255,0.16);
      color: inherit; font-family: inherit; font-size: var(--label-medium-size); font-weight: 500; cursor: pointer; }
    .breath-ui.is-paused .b2-ambience, .breath-ui.is-ready .b2-ambience, .breath-ui.is-done .b2-ambience {
      background: var(--sys-surface-container-lowest); border-color: var(--sys-outline-variant); }

    .b2-center { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 24px; }
    .b2-phase { font-size: 38px; line-height: 1.15; font-weight: 500; letter-spacing: -0.01em; text-shadow: 0 2px 24px rgba(5,7,15,0.18); }

    .b2-footer { display: flex; flex-direction: column; align-items: center; gap: 20px; padding-bottom: var(--pad-4); }
    .b2-time { font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
    .b2-play { width: 72px; height: 72px; border-radius: 50%; border: 0; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 10px 34px rgba(5,7,15,0.22);
      transition: filter .12s, background .3s ease, color .3s ease; }
    .b2-play:hover { filter: brightness(1.06); }
    .breath-ui.is-in .b2-play, .breath-ui.is-out .b2-play { background: var(--sys-surface-container-lowest); }
    .breath-ui.is-in .b2-play  { color: var(--sys-primary); }
    .breath-ui.is-out .b2-play { color: var(--sys-primary-container); }
    .breath-ui.is-paused .b2-play, .breath-ui.is-ready .b2-play, .breath-ui.is-done .b2-play {
      background: var(--sys-primary); color: var(--sys-on-primary); }

    /* ===== Practice = full-screen breathing behind a persistent UI frame =====
     * The app + card go transparent (transitioned) so the breathing shows through, and
     * clicks fall through the empty card to the breathing controls — while the nav,
     * progress and footer stay interactive on top. */
    .app, .section-wrap, .section-card { transition: background-color .6s ease, box-shadow .6s ease; }
    .frame.is-practice .app,
    .frame.is-practice .section-wrap,
    .frame.is-practice .section-card { background: transparent; transition: background-color 1.4s ease, box-shadow 1.4s ease; }
    .frame.is-practice .section-card { box-shadow: none; }
    .frame.is-practice .screen { pointer-events: none; }
    .frame.is-practice .navbar,
    .frame.is-practice .section-progress,
    .frame.is-practice .section-actions { pointer-events: auto; }
    /* nav transparent so the breathing extends behind it */
    .frame.is-practice .navbar { background: transparent; border-bottom-color: transparent; }

    /* Play pressed → the whole app frame (nav, progress bar, footer) fades away so only the breathing
       remains; Pause brings it all back. The breathing layer/visuals are untouched. */
    .frame.is-practice .navbar,
    .frame.is-practice .section-progress,
    .frame.is-practice .section-actions { transition: opacity .55s ease, background-color .5s ease, border-color .5s ease; }
    .frame.is-running .navbar,
    .frame.is-running .section-progress,
    .frame.is-running .section-actions { opacity: 0; pointer-events: none; }

    /* smooth chrome recolor when the breathing goes light↔dark */
    .navbar, .navbar .nav-item, .crumbs a, .crumbs .c-cur, .crumbs .c-muted, .crumbs .sep,
    .ptab .lbl, .actions-help { transition: color .5s ease, background .5s ease; }
    .brandmark path { transition: fill .5s ease; }
    /* when the breathing is DARK (running in/out), flip the frame chrome to light glass */
    .frame.is-dark .navbar { background: rgba(255,255,255,0.08); border-bottom-color: rgba(255,255,255,0.16);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    .frame.is-dark .navbar .nav-item { color: var(--sys-on-primary); }
    .frame.is-dark .nav-item:hover { background: rgba(255,255,255,0.16); }
    .frame.is-dark .crumbs a, .frame.is-dark .crumbs .c-cur,
    .frame.is-dark .crumbs .c-muted, .frame.is-dark .crumbs .sep { color: rgba(255,255,255,0.9); }
    .frame.is-dark .brandmark path { fill: rgba(255,255,255,0.92); }
    .frame.is-dark .ptab .lbl { color: rgba(255,255,255,0.6); }
    .frame.is-dark .ptab.done .lbl, .frame.is-dark .ptab.cur .lbl { color: #fff; }
    .frame.is-dark .section-actions { border-top-color: rgba(255,255,255,0.18); }
    .frame.is-dark .actions-help { color: rgba(255,255,255,0.75); }
    /* filled Continue → white pill so it stays visible on the primary-blue inhale */
    .frame.is-dark .sr-btn--filled { background: var(--sys-surface-container-lowest); color: var(--sys-primary); }
    .frame.is-dark .sr-btn--filled:hover { filter: brightness(0.97); }

    /* callout quote */
    .quote { display: flex; gap: 14px; }
    .quote .bar { width: 3px; border-radius: 2px; background: var(--sys-primary); flex: none; }

    /* NonSystem mood meter — a playful, relaxing mood check */
    .mood { display: flex; flex-direction: column; gap: 18px; align-items: center; padding: 4px 0 2px; }
    .mood-word { font-size: 22px; line-height: 1.2; font-weight: 600; color: var(--sys-on-surface); transition: color .2s ease; }
    .mood-slider { position: relative; width: 100%; height: 64px; }
    .mood-track { position: absolute; top: 50%; left: 0; right: 0; height: 16px; transform: translateY(-50%); border-radius: var(--radius-full);
      background: linear-gradient(90deg, #c9d3e8 0%, #e9e2ec 50%, #ffe1a6 100%); }
    .mood-range { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: grab; }
    .mood-range:active { cursor: grabbing; }
    .mood-thumb { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 56px; height: 56px; border-radius: 50%;
      background: #fff; box-shadow: 0 6px 16px rgba(0,0,0,0.16); display: flex; align-items: center; justify-content: center;
      pointer-events: none; transition: left .1s ease; }
    .mood-glow { position: absolute; inset: -8px; border-radius: 50%; animation: moodBreathe 3.6s ease-in-out infinite; }
    @keyframes moodBreathe { 0%, 100% { transform: scale(1); opacity: .45; } 50% { transform: scale(1.18); opacity: .8; } }
    .mood-scale { display: flex; justify-content: space-between; width: 100%; font-size: var(--label-small-size); color: var(--sys-on-surface-variant); }
    .ns-note { font-size: 11px; color: var(--sys-on-surface-variant); font-style: italic; }

    .pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: var(--radius-full); background: var(--state-primary-08); color: var(--sys-primary); font-size: var(--label-small-size); font-weight: 600; }
    .medallion { width: 56px; height: 56px; border-radius: 50%; background: var(--state-primary-08); display: flex; align-items: center; justify-content: center; color: var(--sys-primary); }
    .medallion.solid { background: var(--sys-primary); color: var(--sys-on-primary); }

    /* Rings — Apple Watch-style activity rings (borrowed from Three Good Things) for the celebrate beat */
    .m-rings { position: relative; width: 104px; height: 104px; display: flex; align-items: center; justify-content: center; background: transparent; }
    .m-rings svg { display: block; background: transparent; }
    .m-rings.idle { animation: ringsBreathe 3.6s ease-in-out infinite; }
    @keyframes ringsBreathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
    .ring-fill { animation: ringFill 1.15s cubic-bezier(.32,.94,.36,1) both; }
    @keyframes ringFill { from { stroke-dashoffset: var(--c); } to { stroke-dashoffset: 0; } }
    /* celebrate beat — immersive overlay centered on the breathing background */
    .celeb-ui { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center;
      padding: 0 24px; text-align: center; color: var(--sys-primary-container); pointer-events: none; }
    .celeb-stack { display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .celeb-title { opacity: 0; animation: celebTitleIn .6s ease 1.45s both; }
    @keyframes celebTitleIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* immersive color screens — drop the top progress tracker + nav, keep the footer (Go Back / Next /
       counter). is-dark keeps that footer legible on the blue. */
    .frame.is-bare .navbar { opacity: 0; pointer-events: none; }
    .frame.is-bare .section-progress { opacity: 0; pointer-events: none; }

    /* immersive prompt — white text by default; dark text on the pale "ready"/early tones */
    .gnd-ui { color: var(--sys-on-primary); animation: gndIn .5s ease .12s both !important; }
    .gnd-ui.is-lighttone { color: var(--sys-primary-container); }
    @keyframes gndIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .gnd-prompt { display: flex; flex-direction: column; align-items: center; gap: 16px; max-width: 580px; }
    .gnd-icon { display: inline-flex; margin-bottom: 2px; opacity: .95; }
    .gnd-desc { margin: 0; font-size: var(--body-large-size); line-height: var(--body-large-lh); color: inherit; }
    .gnd-guide { font-size: var(--body-medium-size); line-height: var(--body-medium-lh); color: inherit; opacity: .74; }
    /* hide the breathing orb during the celebrate beat so only the ring + title read */
    .frame.is-celebrate .b2-orb { opacity: 0; transition: opacity .6s ease; }
    /* leaving the celebrate beat — fade the whole breathing layer + Well Done out so the hand-off to
       "Pick your moment" is a smooth dissolve rather than a hard cut */
    .frame.is-celeb-exit .practice-bg-layer { opacity: 0; transition: opacity .4s ease; }
    .frame.is-celeb-exit .celeb-ui { opacity: 0; transition: opacity .35s ease; }
  </style>
</head>

/* ============================================================

 * Copy verbatim / adapted from the Proposed Spec: "PACED BREATHING"
 * (Module 1 acute tool) — your first in-the-moment tool.
 * ============================================================ */

      <Title eyebrow="In-Between Care · Grounding" title="Come back to right now">

        noticing is the whole point.
      </Title>
      <HeroCard
        icon={<IcHeart size={32} />}
        title="A five-senses grounding walk"
        subtitle="Notice each one, then continue at your own pace"
        chip="About 2 min · Grounding"
      />
    </>
  );
}

// Screen 2 — Learn (how the exercise works). Mirrors In-the-Moment Reset's "Why the out-breath
// matters": a Title + a labeled pattern grid — here the 5-4-3-2-1 sense countdown.
function Learn() {
  return (
    <>
      <Title eyebrow="Learn" title="How grounding works">
        When your thoughts won't stop looping, your senses are an anchor to right now. You'll count down

        right; the noticing itself is what settles you.
      </Title>
      <div>

        <div className="ex-grid ex-grid--5">
          {[
            { num: "5", k: "See",   copy: "Look around you." },
            { num: "4", k: "Hear",  copy: "Near and far." },
            { num: "3", k: "Feel",  copy: "Touch or texture." },
            { num: "2", k: "Smell", copy: "Scents in the air." },
            { num: "1", k: "Taste", copy: "A sip, or the air." },

// The full-screen color field — a solid tone per sense that cross-fades on each Next (no orb).
function BgField({ tone }) {
  return <div className={"breathe2 " + (tone || "tone-see")} />;
}

// Immersive sense prompt — a big headline + two description lines on the color field. Keyed by sense
// so it fades in cleanly each time the prompt changes.
function SenseOverlay({ sense, light }) {
  return (
    <div className={"breath-ui gnd-ui" + (light ? " is-lighttone" : "")} key={sense.key}>
      <div className="b2-center">
        <div className="gnd-prompt">
          <span className="gnd-icon">{sense.icon ? React.createElement(sense.icon, { size: 40 }) : null}</span>
          <div className="b2-phase">{sense.prompt}</div>
          <p className="gnd-desc">{sense.hint}</p>
          <p className="gnd-desc gnd-guide">Take a moment to notice them around you — then continue when you're ready.</p>
        </div>
      </div>
    </div>

}

// The soft-blue lead-in — "Ready when you are", modeled on In-the-Moment Reset's opening beat.
function ReadyOverlay() {
  return (
    <div className="breath-ui gnd-ui is-lighttone" key="ready">
      <div className="b2-center">
        <div className="gnd-prompt">
          <div className="b2-phase">Ready when you are</div>
          <p className="gnd-desc gnd-guide">We'll go one sense at a time — begin whenever you're ready.</p>
        </div>
      </div>
    </div>

}

// Rings — Apple Watch-style activity rings (borrowed from Three Good Things). All three fill in with
// a staggered animation for a light, playful reward beat (not a "module complete" medallion).
function CelebrateRings() {
  const RINGS = [
    { r: 62, a: "#0AB4E6", b: "#19E6CE" }, // single calming ring
  ];
  return (
    <div className="m-rings idle">
      <svg viewBox="0 0 160 160" width="104" height="104" aria-hidden="true">
        <defs>
          {RINGS.map((ring, i) => (
            <linearGradient key={i} id={"crg" + i} x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor={ring.a} /><stop offset="100%" stopColor={ring.b} />
            </linearGradient>
          ))}
        </defs>
        <g transform="rotate(-90 80 80)">
          {RINGS.map((ring, i) => {
            const C = 2 * Math.PI * ring.r;
            return (
              <g key={i}>
                <circle cx="80" cy="80" r={ring.r} fill="none" stroke={ring.a} strokeOpacity="0.16" strokeWidth="13" />
                <circle cx="80" cy="80" r={ring.r} fill="none" stroke={"url(#crg" + i + ")"} strokeWidth="13"
                  strokeLinecap="round" strokeDasharray={C} strokeDashoffset="0"
                  className="ring-fill" style={{ "--c": C, animationDelay: (0.55 + i * 0.14) + "s" }} />
              </g>
            );
          })}
        </g>
      </svg>
    </div>
  );
}

// Screen 5.5 — Celebrate (between breathing and Homework). An immersive beat that stays on the

function CelebrateOverlay() {

      <div className="celeb-stack">
        <CelebrateRings />
        <span className="b2-phase celeb-title">Well Done!</span>

}

// Last screen — Done
function Done() {

      <div className="medallion solid"><IcCheck size={30} /></div>
      <div>
        <h1 className="sr-headline-m" style={{ color: "var(--sys-primary-container)", margin: 0 }}>

/* ============================================================
 * App — module player shell + prototype controls
 * ============================================================ */
const SENSES = [
  { key: "see",   n: 5, icon: IcEye,   prompt: "Five things you can see",   hint: "A color, a shape, the way the light falls — anything at all." },
  { key: "hear",  n: 4, icon: IcEar,   prompt: "Four things you can hear",  hint: "Near or far — a hum, a voice, even your own breath." },
  { key: "feel",  n: 3, icon: IcHand,  prompt: "Three things you can feel", hint: "Your feet on the floor, the chair, the air on your skin." },
  { key: "smell", n: 2, icon: IcScent, prompt: "Two things you can smell",  hint: "Coffee, fresh air — or nothing in particular. That counts too." },
  { key: "taste", n: 1, icon: IcDrop,  prompt: "One thing you can taste",   hint: "A sip of water, the last thing you ate, or just the air." },
];
function senseByKey(k) { for (var i = 0; i < SENSES.length; i++) if (SENSES[i].key === k) return SENSES[i]; return null; }

// Background tone per immersive stage — a single blue that deepens toward the Well Done shade.
// `light` marks the pale blues that need dark text + dark chrome (like the reset "ready" state).
const TONES = {
  ready: { cls: "tone-ready", light: true },
  see:   { cls: "tone-see",   light: true },
  hear:  { cls: "tone-hear",  light: true },
  feel:  { cls: "tone-feel",  light: true },
  smell: { cls: "tone-smell", light: true },
  taste: { cls: "tone-taste", light: true },
  celebrate: { cls: "tone-celebrate", light: false },
};

// Progress tracker — 3 segments; the lead-in + five senses all sit under "Ground".
const STEPS = [
  { key: "start",  label: "Start",  slug: "intro" },
  { key: "ground", label: "Practice", slug: "ground" },
  { key: "done",   label: "Done",   slug: "done" },
];
// Internal flow: intro → "Ready when you are" → five sense color fields → Well Done → done.
const STAGES = [
  { key: "intro",     step: 0 },
  { key: "learn",     step: 0 },
  { key: "ready",     step: 1 },
  { key: "see",       step: 1 },
  { key: "hear",      step: 1 },
  { key: "feel",      step: 1 },
  { key: "smell",     step: 1 },
  { key: "taste",     step: 1 },
  { key: "celebrate", step: 1 },
  { key: "done",      step: 2 },
];

function App() {
  const [idx, setIdx] = useState(0);
  const [shownIdx, setShownIdx] = useState(0);
  const [leaving, setLeaving] = useState(false);

  // Shell bridge — report the current step; grounding has no inputs to carry.
  React.useEffect(() => {
    function onMsg(e) {
      var m = e && e.data;
      if (!m || typeof m !== "object") return;
      if (m.type === "reset:getState") {
        var w = e.source || window.parent;
        if (w) w.postMessage({ type: "reset:state", idx: idx, data: {} }, "*");
      } else if (m.type === "reset:next") {
        setIdx(function (i) { return Math.min(i + 1, STAGES.length - 1); });
      } else if (m.type === "reset:prev") {
        var pt = idx - 1;
        if (STAGES[pt] && STAGES[pt].key === "celebrate") pt -= 1; // skip the auto-advancing Well Done beat
        setIdx(Math.max(pt, 0));
      } else if (m.type === "reset:setState") {
        if (typeof m.idx === "number") { setIdx(m.idx); setShownIdx(m.idx); setLeaving(false); }
      }
    }
    window.addEventListener("message", onMsg);
    return function () { window.removeEventListener("message", onMsg); };
  }, [idx]);

  // Cross-dissolve card content on stage change (intro/done cards; immersive stages have null body).
  React.useEffect(() => {
    if (idx === shownIdx) return;
    setLeaving(true);
    const t = setTimeout(() => { setShownIdx(idx); setLeaving(false); }, 450);
    return () => clearTimeout(t);
  }, [idx]);

  const cur = STAGES[idx];
  const shown = STAGES[shownIdx];
  const last = idx === STAGES.length - 1;
  const progressCurrent = STAGES[idx].step;

  const curSense = senseByKey(cur.key);
  const onSense = !!curSense;
  const onReady = cur.key === "ready";
  const onColor = onReady || onSense;           // immersive color screens
  const curTone = TONES[cur.key];               // { cls, light } for the current color field
  const onCelebrate = cur.key === "celebrate";
  // keep the color field + Well Done overlay + hidden chrome alive through the exit animation (shown lags idx)
  const showCeleb = onCelebrate || shown.key === "celebrate";
  const onImmersive = onColor || onCelebrate || !!TONES[shown.key];
  const celebExiting = leaving && shown.key === "celebrate" && cur.key !== "celebrate";

  // Well Done is a brief immersive beat — auto-advance to Done once the ring + title land.
  React.useEffect(function () {
    if (STAGES[idx].key !== "celebrate") return;
    var t = setTimeout(function () { setIdx(function (i) { return Math.min(i + 1, STAGES.length - 1); }); }, 3600);
    return function () { clearTimeout(t); };
  }, [idx]);

  // Immersive color screens: drop the top progress tracker + nav (is-bare), keep the footer legible on
  // the blue (is-dark). Well Done hides all chrome (is-running).
  const frameClass = "frame"
    + (onImmersive ? " is-practice" : "")
    + (onColor && curTone && !curTone.light ? " is-dark" : "")  // light chrome only on the deeper blues
    + (onColor && !onReady ? " is-bare" : "")                   // fade tracker + nav on the sense screens (Ready keeps them)
    + (showCeleb ? " is-running is-celebrate" : "")
    + (celebExiting ? " is-celeb-exit" : "");

  const goNext = () => setIdx(idx + 1);
  const goBack = () => {
    var pt = idx - 1;
    if (STAGES[pt] && STAGES[pt].key === "celebrate") pt -= 1; // skip the Well Done beat going back
    setIdx(Math.max(pt, 0));
  };

  const nextLabel = idx === 0 ? "Begin" : cur.key === "learn" ? "Continue" : onReady ? "Start" : (cur.key === "taste" ? "Continue" : "Next");

  // intro/done render as cards; ready + sense + celebrate render on the color field (null card body)
  const body = { intro: <Intro />, learn: <Learn />, done: <Done /> }[shown.key] || null;

  const senseNum = onSense ? (SENSES.findIndex(function (s) { return s.key === cur.key; }) + 1) : 0;
  const helpText = onSense ? ("Sense " + senseNum + " of 5")
    : onReady ? "Grounding"
    : ("Step " + (progressCurrent + 1) + " of " + STEPS.length);
  // which tone the color field shows — the current stage's blue, holding through Well Done/exit
  const fieldTone = curTone ? curTone.cls
    : (showCeleb ? "tone-celebrate" : (TONES[shown.key] ? TONES[shown.key].cls : "tone-see"));

  const actions = last ? (
    <>
      <Button variant="outlined" onClick={() => { setIdx(0); setShownIdx(0); }}>Run it again</Button>
      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
        <Button variant="tonal" leadingIcon={<IcBell size={18} />}>Set a Reminder</Button>
        <Button variant="filled" trailingIcon={<IcArrowR size={18} />}>Back to Stress Program</Button>
      </div>
    </>
  ) : (
    <>
      <Button variant="outlined" leadingIcon={<IcChevL size={18} />} disabled={idx === 0} onClick={goBack}>Go Back</Button>
      <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
        <span className="actions-help">{helpText}</span>
        <Button variant="filled" trailingIcon={<IcArrowR size={18} />} onClick={goNext}>{nextLabel}</Button>
      </div>
    </>
  );

  return (
    <div className={frameClass}>
      {/* full-screen color field — cross-fades tone per sense; holds through the Well Done beat */}
      <div className="practice-bg-layer">
        <BgField tone={fieldTone} />
        {showCeleb ? <CelebrateOverlay /> : (onReady ? <ReadyOverlay /> : (curSense ? <SenseOverlay sense={curSense} light={curTone && curTone.light} /> : null))}
      </div>
      <div className="screen">
        <div className="app">
          <HeaderNav />
          <ContentSectionTemplate steps={STEPS} current={progressCurrent} actions={actions}
            contentKey={shown.key} leaving={leaving}
            whole={shown.key === "intro" || shown.key === "learn" || shown.key === "done"}>
            {body}
          </ContentSectionTemplate>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
