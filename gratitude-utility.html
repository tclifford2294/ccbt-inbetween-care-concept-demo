<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CCBT · Three Good Things — Sunrise prototype</title>
  <style>
    /*
     * Material Sunrise — design tokens (inlined so this file is self-contained).
     * Extracted live from the Sunrise Figma files (Foundation & Tokens) and from
     * the GuidanceResources WIP file (Yfpcl4M7hiKSqdzgZBRmDt) on 2026-07-16.
     * Every value maps 1:1 to a Sunrise variable name. Reference these custom
     * properties only — no raw literals in component code. Mirrored in tokens.css.
     */
    :root {
      /* color roles — accent */
      --sys-primary:            #075cba;
      --sys-on-primary:         #ffffff;
      --sys-primary-container:  #070f36;
      --sys-primary-fixed-dim:  #e3f2fd;
      --sys-tertiary:           #ffffff;

      /* color roles — surface */
      --sys-surface:                    #f3f4f6;
      --sys-surface-container-lowest:   #ffffff;
      --sys-surface-container:          #f3f4f6;
      --sys-surface-container-high:     #eceeef;
      --sys-surface-container-highest:  #e6e8ea;
      --sys-on-surface:                 #1b1d22;
      --sys-on-surface-variant:         #565f6c;

      /* color roles — outline */
      --sys-outline:          #ebecf0;
      --sys-outline-variant:  #d7dbe0;

      /* color roles — custom / status */
      --sys-info:             #226cee;
      --sys-success:          #278647;
      --sys-error:            #d82727;
      --sys-error-container:  #f7d4d4;

      /* color roles — inverse */
      --sys-inverse-on-surface: #ffffff;

      /* color roles — transparent */
      --sys-primary-20:  rgba(7, 92, 186, 0.08);
      --sys-white-80:    rgba(255,255,255,0.80);
      --sys-white-50:    rgba(255,255,255,0.50);
      --sys-black-50:    rgba(0,0,0,0.50);

      /* typography — family (Google Sans is the Sunrise brand face) */
      --font-family: "Google Sans", "Google Sans Text", "Product Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

      /* type scale (size / line-height / tracking / weight) */
      --headline-medium-size: 40px;  --headline-medium-lh: 48px;
      --headline-small-size: 32px;   --headline-small-lh: 38.4px;
      --title-medium-size: 24px;     --title-medium-lh: 31.2px;    --title-medium-weight: 500;
      --body-large-size: 20px;       --body-large-lh: 30px;
      --body-medium-size: 16px;      --body-medium-lh: 24px;
      --body-small-size: 14px;       --body-small-lh: 20px;
      --label-large-size: 16px;      --label-large-lh: 22.4px;     --label-large-weight: 500;
      --label-medium-size: 14px;     --label-medium-lh: 20px;      --label-medium-track: 0.07px;
      --label-small-size: 12px;      --label-small-lh: 18px;       --label-small-weight: 500; --label-small-track: 0.12px;

      /* shape / radius */
      --radius-sm:   8px;
      --radius-md:   12px;
      --radius-lg:   16px;
      --radius-full: 999px;

      /* spacing / padding scale */
      --pad-2: 2px;  --pad-4: 4px;   --pad-8: 8px;   --pad-12: 12px;
      --pad-16: 16px; --pad-20: 20px; --pad-24: 24px; --pad-32: 32px;
      --pad-40: 40px; --pad-48: 48px;

      /* stroke */
      --stroke-thin: 1px;
      --stroke-medium: 1.5px;

      /* elevation */
      --elev-1: 0 2px 8px rgba(0,0,0,0.04), 0 2px 4px rgba(0,0,0,0.06);
      --elev-2: 0 4px 16px rgba(0,0,0,0.10), 0 2px 4px rgba(0,0,0,0.08);

      /* M3 state-layer tints derived from the resolved roles above */
      --state-primary-08:     rgba(7, 92, 186, 0.08);
      --state-on-surface-04:  rgba(27, 29, 34, 0.04);
      --state-on-surface-08:  rgba(27, 29, 34, 0.08);
      --state-error-08:       rgba(216, 39, 39, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--sys-surface); }
    body {
      font-family: var(--font-family);
      color: var(--sys-on-surface);
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; cursor: pointer; }
    input, textarea { font-family: inherit; }
    a { color: var(--sys-primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ---- app frame (no browser chrome) ---- */
    .frame { display: flex; flex-direction: column; min-height: 100vh; background: var(--sys-surface); }
    .screen { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }

    /* ---- prototype step navigator (a review control, not part of the app) ---- */
    .stepnav { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 12px; color: var(--sys-on-surface-variant); font-size: 13px; background: var(--sys-surface); border-top: var(--stroke-thin) solid var(--sys-outline); }
    .stepnav button { background: var(--sys-surface-container-lowest); color: var(--sys-on-surface); border: 1px solid var(--sys-outline-variant); border-radius: var(--radius-full); height: 32px; padding: 0 14px; font-size: 13px; }
    .stepnav button:disabled { opacity: .4; cursor: default; }
    .dots { display: flex; gap: 7px; }
    .dots b { width: 8px; height: 8px; border-radius: 50%; background: var(--sys-outline-variant); display: block; cursor: pointer; }
    .dots b.on { background: var(--sys-primary); }

    /* ---- Sunrise type primitives ---- */
    .sr-headline-m { font-size: var(--headline-medium-size); line-height: var(--headline-medium-lh); font-weight: 400; margin: 0; }
    .sr-headline-s { font-size: var(--headline-small-size); line-height: var(--headline-small-lh); font-weight: 400; margin: 0; }
    .sr-body-m { font-size: var(--body-medium-size); line-height: var(--body-medium-lh); font-weight: 400; }
    .sr-label-l { font-size: var(--label-large-size); line-height: var(--label-large-lh); font-weight: var(--label-large-weight); }
    .sr-label-m { font-size: var(--label-medium-size); line-height: var(--label-medium-lh); font-weight: 400; letter-spacing: var(--label-medium-track); }
    .eyebrow { font-size: var(--label-small-size); line-height: var(--label-small-lh); font-weight: var(--label-small-weight); letter-spacing: .06em; text-transform: uppercase; color: var(--sys-primary); }

    /* ---- Sunrise: Header Navigation ---- */
    .navbar { height: 64px; background: var(--sys-surface-container-lowest); border-bottom: var(--stroke-thin) solid var(--sys-outline); display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 12px; }
    .nav-left { display: flex; align-items: center; gap: var(--pad-4); }
    .nav-right { display: flex; align-items: center; gap: var(--pad-12); }
    .icon-buttons { display: flex; align-items: center; gap: var(--pad-8); }
    .nav-item { width: 40px; height: 40px; border-radius: var(--radius-full); background: transparent; border: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--sys-on-surface); position: relative; }
    .nav-item:hover { background: var(--state-on-surface-04); }
    .brandmark { display: inline-flex; align-items: center; }
    .badge { position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: var(--radius-full); background: var(--sys-primary); color: var(--sys-on-primary); font-size: var(--label-small-size); font-weight: var(--label-small-weight); border: var(--stroke-thin) solid var(--sys-surface-container-lowest); display: inline-flex; align-items: center; justify-content: center; }
    .nav-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--sys-primary-fixed-dim); color: var(--sys-primary); border: var(--stroke-thin) solid var(--sys-primary-20); display: inline-flex; align-items: center; justify-content: center; font-size: var(--label-small-size); font-weight: var(--label-small-weight); }
    .crumbs { display: flex; align-items: center; font-size: var(--label-medium-size); letter-spacing: var(--label-medium-track); }
    .crumbs .crumb { padding: 2px 8px; display: inline-flex; align-items: center; }
    .crumbs .sep { color: var(--sys-on-surface-variant); }
    .crumbs .c-muted { color: var(--sys-on-surface-variant); }
    .crumbs .c-cur { color: var(--sys-on-surface); }
    .emergency { height: 40px; border-radius: var(--radius-full); background: var(--sys-surface-container-lowest); border: var(--stroke-thin) solid var(--sys-error); color: var(--sys-error); display: inline-flex; align-items: center; gap: 8px; padding: 0 16px 0 10px; font-size: var(--label-medium-size); font-weight: 500; white-space: nowrap; }
    .emergency:hover { background: var(--state-error-08); }
    .emergency .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--sys-error); color: #fff; display: inline-flex; align-items: center; justify-content: center; }

    /* ---- Sunrise: Content Section Template (the white card shell) ---- */
    .app { flex: 1; min-height: 0; background: var(--sys-surface); display: flex; flex-direction: column; }
    .section-wrap { flex: 1; min-height: 0; padding: 16px; display: flex; }
    .section-card { flex: 1; min-height: 0; background: var(--sys-surface-container-lowest); border-radius: var(--radius-lg); box-shadow: var(--elev-1); display: flex; flex-direction: column; overflow: hidden; }
    .section-progress { padding: 28px 32px 4px; }
    .section-body { flex: 1; min-height: 0; padding: 20px 32px; display: flex; justify-content: center; overflow: auto; }
    .col { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: var(--pad-40); }

    /* immersive sub-flow (Step 3) — cross-dissolve between sub-steps */
    .ex-stage { display: flex; flex-direction: column; gap: var(--pad-40); transition: opacity 220ms ease; }
    .ex-stage.in  { opacity: 1; }
    .ex-stage.out { opacity: 0; }
    /* staggered entrance applied to every step's content blocks (and Practice sub-flow) */
    @keyframes revealIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .col > *:not(.ex-stage), .ex-stage > * { animation: revealIn .7s ease both; }
    .col > *:not(.ex-stage):nth-child(1), .ex-stage > *:nth-child(1) { animation-delay: 0s; }
    .col > *:not(.ex-stage):nth-child(2), .ex-stage > *:nth-child(2) { animation-delay: .55s; }
    .col > *:not(.ex-stage):nth-child(3), .ex-stage > *:nth-child(3) { animation-delay: 1.25s; }
    .col > *:not(.ex-stage):nth-child(4), .ex-stage > *:nth-child(4) { animation-delay: 1.95s; }
    .col > *:not(.ex-stage):nth-child(5), .ex-stage > *:nth-child(5) { animation-delay: 2.65s; }
    /* Intro / Learn / Done: whole content fades in together (no stagger) */
    .col--whole { animation: revealIn .7s ease both; }
    .col--whole > * { animation: none !important; }
    .ex-recap { display: flex; flex-direction: column; gap: 6px; }
    .ex-recap .k { font-size: var(--label-small-size); line-height: var(--label-small-lh); font-weight: var(--label-small-weight); letter-spacing: .06em; text-transform: uppercase; color: var(--sys-on-surface-variant); }
    .section-actions { border-top: var(--stroke-thin) solid var(--sys-outline); padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .actions-help { color: var(--sys-on-surface-variant); font-size: var(--label-medium-size); }

    /* ---- Sunrise: Progress Tracker (underline step-tabs) ---- */
    .ptrack { display: flex; gap: 8px; max-width: 860px; margin: 0 auto; }
    .ptab { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; background: transparent; border: 0; padding: 0; text-align: left; }
    .ptab .lbl { font-size: var(--label-medium-size); line-height: var(--label-medium-lh); color: var(--sys-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ptab.done .lbl, .ptab.cur .lbl { color: var(--sys-on-surface); font-weight: 500; }
    .ptab .bar { height: 3px; border-radius: var(--radius-full); background: var(--sys-outline-variant); }
    .ptab.done .bar, .ptab.cur .bar { background: var(--sys-success); }

    /* ---- Sunrise: Button ---- */
    .sr-btn { height: 48px; border-radius: var(--radius-full); padding: 0 24px; font-size: var(--label-large-size); line-height: var(--label-large-lh); font-weight: var(--label-large-weight); display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: var(--stroke-thin) solid transparent; transition: filter .12s, background .12s; }
    .sr-btn--filled { background: var(--sys-primary); color: var(--sys-on-primary); }
    .sr-btn--filled:hover { filter: brightness(1.08); }
    .sr-btn--filled:disabled { background: var(--sys-surface-container-high); color: var(--sys-on-surface-variant); cursor: default; filter: none; }
    .sr-btn--outlined { background: var(--sys-surface-container-lowest); color: var(--sys-on-surface); border-color: var(--sys-outline-variant); }
    .sr-btn--outlined:hover { background: var(--state-on-surface-04); }
    .sr-btn--text { background: transparent; color: var(--sys-primary); height: 44px; padding: 0 12px; }
    .sr-btn--text:hover { background: var(--state-primary-08); }
    .sr-btn--tonal { background: var(--sys-primary-fixed-dim); color: var(--sys-primary); }
    .sr-btn--tonal:hover { filter: brightness(0.97); }

    /* ---- Sunrise: Input Field ---- */
    .sr-field { display: flex; flex-direction: column; gap: 8px; }
    .sr-flabel { display: flex; gap: 4px; align-items: center; font-size: var(--body-medium-size); line-height: var(--body-medium-lh); font-weight: 500; color: var(--sys-on-surface); }
    .sr-fhelp { font-size: var(--label-medium-size); line-height: var(--label-medium-lh); color: var(--sys-on-surface-variant); }
    .sr-input, .sr-textarea { width: 100%; border-radius: var(--radius-md); border: var(--stroke-thin) solid var(--sys-outline-variant); background: var(--sys-surface-container-lowest); padding: 14px 16px; font-size: var(--body-medium-size); line-height: var(--body-medium-lh); color: var(--sys-on-surface); outline: none; transition: border-color .12s, box-shadow .12s; }
    .sr-input { height: 56px; padding: 0 16px; }
    .sr-textarea { resize: vertical; min-height: 88px; }
    .sr-input::placeholder, .sr-textarea::placeholder { color: var(--sys-on-surface-variant); }
    .sr-input:focus, .sr-textarea:focus { border-color: var(--sys-primary); box-shadow: 0 0 0 1px var(--sys-primary); }

    /* ---- Sunrise: Divider ---- */
    .sr-divider { height: 1px; background: var(--sys-outline); border: 0; width: 100%; margin: 0; }

    /* ---- Sunrise: Card ---- */
    .sr-card { background: var(--sys-surface-container-lowest); border-radius: var(--radius-lg); border: 1px solid var(--sys-outline); box-shadow: var(--elev-1); padding: var(--pad-24); }
    .sr-card--muted { background: var(--sys-surface-container); border: 0; box-shadow: none; }

    /* ---- Sunrise: Card Item / Style=Image (hero media card, node 1340:17442) ---- */
    .herocard { position: relative; width: 100%; min-height: 156px; border-radius: var(--radius-lg); overflow: hidden;
      background: linear-gradient(135deg, var(--sys-primary-container) 0%, var(--sys-primary) 150%); }
    .herocard .hc-media { position: absolute; inset: 0; background-image: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.12) 40%, rgba(0,0,0,0.12) 60%, rgba(0,0,0,0.4) 100%); mix-blend-mode: multiply; pointer-events: none; }
    .herocard .hc-content { position: relative; min-height: 156px; padding: var(--pad-16); display: flex; flex-direction: column; justify-content: space-between; gap: var(--pad-24); }
    .herocard .hc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; width: 100%; }
    .herocard .hc-icon { width: 32px; height: 32px; flex: none; color: var(--sys-inverse-on-surface); display: inline-flex; }
    .herocard .hc-text { display: flex; flex-direction: column; gap: var(--pad-2); }
    .herocard .hc-title { font-size: var(--body-large-size); line-height: var(--body-large-lh); font-weight: 400; color: var(--sys-inverse-on-surface); margin: 0; }
    .herocard .hc-desc { font-size: var(--body-small-size); line-height: var(--body-small-lh); color: var(--sys-white-80); }
    .herocard .hc-chip { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: var(--radius-full); background: rgba(255,255,255,0.14); color: var(--sys-inverse-on-surface); font-size: var(--label-small-size); font-weight: var(--label-small-weight); white-space: nowrap; }

    /* ---- Sunrise: Selection Card (selectable row) ---- */
    .selcard { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--sys-surface-container-lowest); border: var(--stroke-thin) solid var(--sys-outline-variant); border-radius: var(--radius-md); padding: 16px 18px; min-height: 56px; transition: background .12s, border-color .12s, box-shadow .12s; }
    .selcard:hover { background: var(--state-on-surface-04); }
    .selcard.sel { border-color: var(--sys-primary); border-width: var(--stroke-medium); background: var(--sys-primary-20); }
    .selcard .lead { color: var(--sys-on-surface-variant); display: inline-flex; }
    .selcard.sel .lead { color: var(--sys-primary); }
    .selcard .txt { flex: 1; font-size: var(--body-medium-size); line-height: var(--body-medium-lh); color: var(--sys-on-surface); }
    .selcard .txt.ph { color: var(--sys-on-surface-variant); }
    .selcard .check { width: 22px; height: 22px; flex: none; border-radius: 6px; border: 2px solid var(--sys-outline-variant); display: inline-flex; align-items: center; justify-content: center; color: transparent; }
    .selcard.sel .check { background: var(--sys-primary); border-color: var(--sys-primary); color: #fff; }

    /* ---- Concept 2: vertical numbered option cards (focus-outline selection) ---- */
    .opt-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 4px; }
    .opt-card { display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 36px 20px; min-height: 264px; justify-content: space-between;
      background: var(--sys-surface-container-lowest); border: var(--stroke-thin) solid var(--sys-outline-variant);
      border-radius: var(--radius-md); transition: border-color .12s, box-shadow .12s, background .12s; }
    .opt-card:hover { background: var(--state-on-surface-04); }
    .opt-card.sel { border-color: var(--sys-primary); box-shadow: 0 0 0 2px var(--sys-primary); background: var(--sys-surface-container-lowest); }
    .opt-num { width: 60px; height: 60px; flex: none; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
      background: var(--sys-primary-fixed-dim); color: var(--sys-primary);
      font-size: 28px; line-height: 1; font-weight: 600; }
    .opt-card.sel .opt-num { background: var(--sys-primary); color: var(--sys-on-primary); }
    .opt-copy { font-size: var(--body-medium-size); line-height: var(--body-medium-lh); color: var(--sys-on-surface); padding-bottom: 4px; }

    /* ---- Sunrise: Option Card (screen-4 style tile) ---- */
    .optgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .optcard { border: var(--stroke-thin) solid var(--sys-outline-variant); border-radius: var(--radius-md); padding: 20px; display: flex; flex-direction: column; gap: 28px; min-height: 150px; background: var(--sys-surface-container-lowest); }
    .optcard .top { display: flex; align-items: flex-start; justify-content: space-between; }
    .optcard .chip { width: 44px; height: 44px; border-radius: 50%; background: var(--sys-surface-container-high); color: var(--sys-on-surface); display: inline-flex; align-items: center; justify-content: center; }
    .optcard .otitle { font-size: var(--body-medium-size); line-height: var(--body-medium-lh); color: var(--sys-on-surface); }

    /* Concept 2: "An example" broken into step boxes (per Option Card style) */
    .ex-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 12px; }
    .ex-box { display: flex; flex-direction: column; justify-content: flex-start; gap: var(--pad-24); min-height: 208px;
      background: var(--sys-surface-container-lowest); border: var(--stroke-thin) solid var(--sys-outline-variant);
      border-radius: var(--radius-md); padding: 18px; }
    .ex-box .ex-top { display: flex; align-items: flex-start; justify-content: space-between; }
    .ex-box .ex-chip { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--sys-surface-container-high);
      color: var(--sys-on-surface); display: inline-flex; align-items: center; justify-content: center; }
    .ex-box .ex-info { color: var(--sys-on-surface-variant); display: inline-flex; }
    .ex-box .ex-text { display: flex; flex-direction: column; gap: 4px; }
    .ex-box .ex-sub { font-size: var(--label-small-size); line-height: var(--label-small-lh); font-weight: var(--label-small-weight); color: var(--sys-on-surface-variant); }
    .ex-box .ex-copy { margin: 0; font-size: var(--body-medium-size); line-height: var(--body-medium-lh); color: var(--sys-on-surface); }

    /* callout quote */
    .quote { display: flex; gap: 14px; }
    .quote .bar { width: 3px; border-radius: 2px; background: var(--sys-primary); flex: none; }

    /* NonSystem mood slider */
    /* NonSystem mood meter — a playful, relaxing mood check (Concept 2) */
    .mood { display: flex; flex-direction: column; gap: 18px; align-items: center; padding: 4px 0 2px; }
    .mood-word { font-size: 22px; line-height: 1.2; font-weight: 600; color: var(--sys-on-surface); transition: color .2s ease; }
    .mood-slider { position: relative; width: 100%; height: 64px; }
    .mood-track { position: absolute; top: 50%; left: 0; right: 0; height: 16px; transform: translateY(-50%); border-radius: var(--radius-full);
      background: linear-gradient(90deg, #c9d3e8 0%, #e9e2ec 50%, #ffe1a6 100%); }
    .mood-range { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: grab; }
    .mood-range:active { cursor: grabbing; }
    .mood-thumb { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 56px; height: 56px; border-radius: 50%;
      background: #fff; box-shadow: 0 6px 16px rgba(0,0,0,0.16); display: flex; align-items: center; justify-content: center;
      pointer-events: none; transition: left .1s ease; }
    .mood-glow { position: absolute; inset: -8px; border-radius: 50%; animation: moodBreathe 3.6s ease-in-out infinite; }
    @keyframes moodBreathe { 0%, 100% { transform: scale(1); opacity: .45; } 50% { transform: scale(1.18); opacity: .8; } }
    .mood-scale { display: flex; justify-content: space-between; width: 100%; font-size: var(--label-small-size); color: var(--sys-on-surface-variant); }
    .ns-note { font-size: 11px; color: var(--sys-on-surface-variant); font-style: italic; }

    /* ---- Grounding (5-4-3-2-1) — tappable "notice" dots ---- */
    .grd-wrap { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 8px 0 4px; }
    .grd-dots { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .grd-dot { width: 60px; height: 60px; flex: none; border-radius: 50%; border: 2px solid var(--sys-outline-variant);
      background: var(--sys-surface-container-lowest); color: transparent; cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center;
      transition: background .18s, border-color .18s, color .18s, transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s; }
    .grd-dot:hover { border-color: var(--sys-primary); background: var(--state-primary-08); }
    .grd-dot.on { background: var(--sys-primary); border-color: var(--sys-primary); color: #fff; transform: scale(1.06);
      box-shadow: 0 8px 20px rgba(7,92,186,.26); }
    .grd-fields { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 560px; margin: 0; }
    .grd-count { font-size: var(--label-large-size); line-height: var(--label-large-lh); color: var(--sys-on-surface-variant);
      min-height: 24px; transition: color .2s ease; }
    .grd-count.done { color: var(--sys-success); font-weight: 500; }

    .pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: var(--radius-full); background: var(--state-primary-08); color: var(--sys-primary); font-size: var(--label-small-size); font-weight: 600; }
    .medallion { width: 56px; height: 56px; border-radius: 50%; background: var(--state-primary-08); display: flex; align-items: center; justify-content: center; color: var(--sys-primary); }
    .medallion.solid { background: var(--sys-primary); color: var(--sys-on-primary); }

    /* ============================================================
       Three Good Things (Utility) — "moment of delight" ported from Immersion:
       a motif picker under the progress bar + a celebration beat after each good thing.
       ============================================================ */
    /* motif picker — white-card styled */
    .motif-picker { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:12px; }
    .motif-picker .mp-label { font-size:11px; letter-spacing:.06em; text-transform:uppercase; font-weight:600; color:var(--sys-on-surface-variant); }
    .mp-seg { display:inline-flex; gap:3px; background:var(--sys-surface-container-high); border:1px solid var(--sys-outline-variant); border-radius:999px; padding:3px; }
    .mp-btn { border:0; background:transparent; border-radius:999px; padding:5px 13px; font-family:inherit; font-size:12px; font-weight:600; color:var(--sys-on-surface-variant); cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:background .15s ease, color .15s ease; white-space:nowrap; }
    .mp-btn:hover { color:var(--sys-on-surface); }
    .mp-btn.on { background:var(--sys-primary); color:#fff; }

    /* celebration layout (centered in the card body) */
    .u-celeb { display:flex; flex-direction:column; align-items:center; text-align:center; gap:26px; padding:12px 0 6px; }
    .u-celeb-caption { font-size:var(--headline-small-size); line-height:var(--headline-small-lh); font-weight:500; color:var(--sys-primary-container); animation: celFade .6s ease both .12s; }
    .u-celeb-scene { position:relative; display:flex; align-items:center; justify-content:center; }
    .u-celeb-echo { margin:0; max-width:520px; font-size:var(--body-large-size); line-height:var(--body-large-lh); color:var(--sys-on-surface-variant); font-style:italic; animation: celFade .6s ease both .28s; }
    .u-celeb-cta { opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity .5s ease, transform .5s ease; }
    .u-celeb-cta.in { opacity:1; transform:none; pointer-events:auto; }
    @keyframes celFade { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
    /* Done crest — the collected motif above the recap */
    .u-done-crest { display:flex; align-items:center; justify-content:center; height:112px; }
    .u-done-crest > * { transform:scale(.56); }

    /* --- Stars --- */
    .m-stars { position:relative; width:300px; height:150px; }
    .m-star { position:absolute; transform:translate(-50%,-50%); }
    .m-star svg { display:block; filter: drop-shadow(0 0 12px rgba(255,206,102,.95)); }
    .m-star.pop { animation: starPop .85s cubic-bezier(.18,1.5,.4,1) both; }
    .m-star.idle { animation: starTwk 2.8s ease-in-out infinite; }
    @keyframes starPop { 0%{opacity:0; transform:translate(-50%,-50%) scale(0) rotate(-50deg);} 55%{opacity:1;} 100%{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0);} }
    @keyframes starTwk { 0%,100%{opacity:.85;} 50%{opacity:1; filter:drop-shadow(0 0 16px rgba(255,206,102,1));} }
    .m-line { position:absolute; inset:0; overflow:visible; pointer-events:none; }
    .m-line path { stroke:rgba(255,196,90,.55); stroke-width:1.5; fill:none; stroke-dasharray:4 5; animation: celFade 1s ease both .3s; }
    .m-spark { position:absolute; width:6px; height:6px; border-radius:50%; background:rgba(255,224,150,.95); box-shadow:0 0 8px rgba(255,206,102,.9); }
    .m-spark.go { animation: sparkFly .9s ease-out forwards .25s; }
    @keyframes sparkFly { 0%{opacity:0; transform:translate(-50%,-50%) scale(1);} 15%{opacity:1;} 100%{opacity:0; transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);} }

    /* --- Rings (Apple Watch-style activity rings) --- */
    .m-rings { position:relative; width:180px; height:180px; display:flex; align-items:center; justify-content:center; }
    .m-rings svg { filter: drop-shadow(0 4px 16px rgba(0,0,0,.16)); }
    .m-rings.idle { animation: ringsBreathe 3.6s ease-in-out infinite; }
    @keyframes ringsBreathe { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.035);} }
    .ring-fill { animation: ringFill 1.15s cubic-bezier(.32,.94,.36,1) both; }
    @keyframes ringFill { from { stroke-dashoffset: var(--c); } to { stroke-dashoffset: 0; } }

    /* --- Logo (ComPsych three-arc mark: fills bottom → middle → top) --- */
    .cl-mark { position:relative; display:flex; align-items:center; justify-content:center; }
    .cl-mark > svg { overflow:visible; filter: drop-shadow(0 4px 12px rgba(7,15,54,.22)); }
    .cl-arc.cl-ghost path { fill: rgba(7,15,54,0.12); }
    .cl-arc.cl-fill path  { fill: var(--sys-primary-container); }
    .cl-arc.cl-wipe path  { transform-box: fill-box; transform-origin: 50% 100%; animation: clFill 1.05s cubic-bezier(.32,.94,.36,1) both; }
    @keyframes clFill { from { transform: scaleY(0.06); opacity: .35; } to { transform: scaleY(1); opacity: 1; } }
    .cl-mark.idle { animation: ringsBreathe 3.6s ease-in-out infinite; }
  </style>
</head>

/* ============================================================
 * Sunrise components — each maps to a published component.
 * ============================================================ */

// Component: Button
function Button({ variant = "filled", leadingIcon, trailingIcon, children, onClick, disabled }) {
  return (
    <button className={`sr-btn sr-btn--${variant}`} onClick={onClick} disabled={disabled}>
      {leadingIcon}{children}{trailingIcon}
    </button>
  );
}

// Component: Input Field
function InputField({ label, help, placeholder, multiline, rows = 4, value, onChange }) {
  return (
    <div className="sr-field">
      {label && <label className="sr-flabel">{label}</label>}
      {help && <span className="sr-fhelp">{help}</span>}
      {multiline
        ? <textarea className="sr-textarea" rows={rows} placeholder={placeholder} value={value} onChange={onChange} />
        : <input className="sr-input" placeholder={placeholder} value={value} onChange={onChange} />}
    </div>
  );
}

// Component: Divider
const Divider = () => <hr className="sr-divider" />;

// Component: Card
function Card({ muted, children, style }) {
  return <div className={"sr-card" + (muted ? " sr-card--muted" : "")} style={style}>{children}</div>;
}

// Component: Card Item / Style=Image — hero media card (branded gradient fill)
// Structure per node 1340:17442: icon (top slot) + title/subtext (bottom). No arrow.
function HeroCard({ icon, title, subtitle, chip }) {
  return (
    <div className="herocard">
      <div className="hc-media" />
      <div className="hc-content">
        <div className="hc-top">
          <span className="hc-icon">{icon}</span>
          {chip && <span className="hc-chip">{chip}</span>}
        </div>
        <div className="hc-text">
          <p className="hc-title">{title}</p>
          {subtitle && <p className="hc-desc">{subtitle}</p>}
        </div>
      </div>
    </div>
  );
}

// Component: Selection Card (from Selection Card Group) — selectable row
function SelectionCard({ selected, leadingIcon, placeholder, text, onClick }) {
  const empty = !text || !text.trim();
  return (
    <button className={"selcard" + (selected ? " sel" : "")} onClick={onClick}>
      {leadingIcon && <span className="lead">{leadingIcon}</span>}
      <span className={"txt" + (empty ? " ph" : "")}>{empty ? placeholder : text}</span>
      <span className="check"><IcCheck size={14} /></span>
    </button>
  );
}

// Component: Progress Tracker — underline step-tabs
function ProgressTracker({ steps, current }) {
  return (
    <div className="ptrack">
      {steps.map((s, i) => (
        <div key={s.label} className={"ptab " + (i < current ? "done" : i === current ? "cur" : "")}>
          <span className="lbl">{s.label}</span>
          <span className="bar" />
        </div>
      ))}
    </div>
  );
}

// Component: Header Navigation (+ Menu, Breadcrumb w/ Logo, Icon Buttons, emergency Button)
function HeaderNav() {
  return (
    <div className="navbar">
      <div className="nav-left">
        <button className="nav-item" aria-label="Menu"><IcMenu size={20} /></button>
        <nav className="crumbs" aria-label="Breadcrumb">
          <span className="crumb"><span className="brandmark"><CompsychMark /></span></span>
          <span className="sep">/</span>
          <a href="#" onClick={e=>e.preventDefault()} className="crumb c-muted">CCBT</a>
          <span className="sep">/</span>
          <a href="#" onClick={e=>e.preventDefault()} className="crumb c-muted">Stress</a>
          <span className="sep">/</span>
          <span className="crumb c-cur">Three Good Things</span>
        </nav>
      </div>
      <div className="nav-right">
        <div className="icon-buttons">
          <button className="nav-item" aria-label="Search"><IcSearch size={20} /></button>
          <button className="nav-item" aria-label="Notifications"><IcBell size={20} /><span className="badge">3</span></button>
          <button className="nav-item" aria-label="My cases"><IcFileUser size={20} /></button>
          <button className="nav-item" aria-label="Account"><span className="nav-avatar">CP</span></button>
        </div>
        <button className="emergency"><span className="dot"><IcPlus size={12} /></span>Having a Critical Emergency?</button>
      </div>
    </div>
  );
}

/* ============================================================
 * Content Section Template — the white card shell that wraps
 * Progress + Title/Content + Actions (from the GuidanceConnect
 * Wizard Page/Form template).
 * ============================================================ */
function ContentSectionTemplate({ steps, current, children, actions, whole, belowProgress }) {
  return (
    <div className="section-wrap">
      <div className="section-card">
        <div className="section-progress">
          <ProgressTracker steps={steps} current={current} />
          {belowProgress}
        </div>
        <div className="section-body">
          <div className={"col" + (whole ? " col--whole" : "")}>{children}</div>
        </div>
        <div className="section-actions">{actions}</div>
      </div>
    </div>
  );
}

// Title block (headline + optional eyebrow + description) — maps to template "Title"
function Title({ eyebrow, title, children }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
      {eyebrow && <span className="eyebrow">{eyebrow}</span>}
      <h1 className="sr-headline-s" style={{ color: "var(--sys-primary-container)" }}>{title}</h1>
      {children && <p className="sr-body-m" style={{ margin: "4px 0 0", color: "var(--sys-on-surface-variant)" }}>{children}</p>}
    </div>
  );
}

/* ============================================================
 * Module screens — Self-Compassion Break (Neff: mindfulness →
 * common humanity → self-kindness). A 2-minute pause to meet a
 * hard, stressful moment with warmth instead of self-criticism.
 * ============================================================ */

// Screen 1 — Intro
function Intro() {
  return (
    <>
      <Title eyebrow="In-Between Care · Gratitude" title="Three good things">
        Stress narrows our attention to whatever's going wrong. This is a gentle counterweight: name
        three good things from your day — big or small. Noticing them on purpose is what shifts the
        balance, even on a hard day.
      </Title>
      <HeroCard
        icon={<IcSpark size={32} />}
        title="Name three good things"
        subtitle="Big or small — they all count"
        chip="About 2 min · Gratitude"
      />
    </>
  );
}

// Screen 1b — Learn: why the practice matters, before naming anything.
function Learn() {
  const points = [
    { icon: <IcInfo size={22} />,  k: "Stress narrows focus", copy: "Under stress, the mind fixates on what's wrong — the good stuff gets easy to miss." },
    { icon: <IcSpark size={22} />, k: "Notice on purpose",    copy: "Naming a few good moments, deliberately, gently trains your attention to find more." },
    { icon: <IcHeart size={22} />, k: "Small but proven",     copy: "A few good things a day is one of the simplest, best-studied ways to lift mood over time." },
  ];
  return (
    <>
      <Title eyebrow="Why it works" title="Why notice the good?">
        It only takes a minute or two — but noticing good things on purpose does something real. Here's why it's
        worth it.
      </Title>
      <div className="optgrid">
        {points.map((p, i) => (
          <div className="optcard" key={i}>
            <div className="top"><span className="chip">{p.icon}</span></div>
            <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              <span style={{ fontWeight: 500, color: "var(--sys-on-surface)" }}>{p.k}</span>
              <p className="otitle" style={{ margin: 0, color: "var(--sys-on-surface-variant)" }}>{p.copy}</p>
            </div>
          </div>
        ))}
      </div>
    </>
  );
}

// Screen 2 — the three-step break. One step at a time (notice → not alone → be kind), driven by the
// footer Continue / Go Back. Write steps take a gentle line (example shown as faint placeholder, never
// required); the middle step is a choose-one reminder. Never gated — there's no wrong way to do this.
function GroundWalk({ data, set, stage }) {
  const [shown, setShown] = useState(stage);
  const [visible, setVisible] = useState(true);
  React.useEffect(() => {
    if (stage === shown) return;
    setVisible(false);
    const t = setTimeout(() => { setShown(stage); setVisible(true); }, 220);
    return () => clearTimeout(t);
  }, [stage]);

  const s = SC_STEPS[shown];
  const val = data[s.field];

  return (
    <div className={"ex-stage " + (visible ? "in" : "out")}>
      <Title eyebrow={s.kicker} title={s.title}>{s.hint}</Title>
      {s.type === "write" ? (
        <div className="grd-fields">
          <textarea className="sr-textarea" rows={3} placeholder={s.ph}
            value={val} onChange={e => set({ ...data, [s.field]: e.target.value })} />
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {s.options.map((o, i) => (
            <SelectionCard key={i} selected={val === i} leadingIcon={<IcHeart size={20} />}
              text={o} onClick={() => set({ ...data, [s.field]: val === i ? null : i })} />
          ))}
        </div>
      )}
    </div>
  );
}

// Screen 3 — Done: a warm sign-off that reflects the three steps back to the member.
function Done({ data, motif }) {
  const rows = [
    { k: "Good thing #1", v: (data.one && data.one.trim()) ? data.one : SC_STEPS[0].ph.replace(/^e\.g\.\s*/, "") },
    { k: "Good thing #2", v: (data.two && data.two.trim()) ? data.two : SC_STEPS[1].ph.replace(/^e\.g\.\s*/, "") },
    { k: "Good thing #3", v: (data.three && data.three.trim()) ? data.three : SC_STEPS[2].ph.replace(/^e\.g\.\s*/, "") },
  ];
  return (
    <>
      <div className="u-done-crest"><MotifScene motif={motif || "stars"} count={3} isNew={false} /></div>
      <h1 className="sr-headline-m" style={{ color: "var(--sys-primary-container)" }}>
        Three good things — noticed on purpose.
      </h1>
      <Card muted>
        <p className="sr-body-m" style={{ margin: 0 }}>
          Savoring the good, even briefly, trains your attention to find more of it. A few good things a
          day is one of the simplest, best-evidenced ways to lighten a stressful stretch.
        </p>
      </Card>
      <Card>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {rows.map((r, i) => (
            <React.Fragment key={i}>
              {i > 0 && <Divider />}
              <div>
                <span className="eyebrow" style={{ color: "var(--sys-on-surface-variant)" }}>{r.k}</span>
                <p className="sr-body-m" style={{ margin: "4px 0 0" }}>{r.v}</p>
              </div>
            </React.Fragment>
          ))}
        </div>
      </Card>
    </>
  );
}

/* ============================================================
 * App — module player shell + prototype controls
 * ============================================================ */
const STEPS = [
  { key: "intro",  label: "Start", slug: "intro" },
  { key: "learn",  label: "Learn", slug: "learn" },
  { key: "ground", label: "Name",  slug: "name" },
  { key: "done",   label: "Done",  slug: "done" },
];

const SC_LAST = 2; // good-things sub-steps: one(0) → two(1) → three(2)

const SC_STEPS = [
  { field: "one", type: "write", kicker: "Good things · 1 of 3", title: "What's one good thing today?",
    hint: "Anything that went right or made you smile — big or small.",
    ph: "e.g. Coffee on the porch before the house woke up." },
  { field: "two", type: "write", kicker: "Good things · 2 of 3", title: "What's another good thing?",
    hint: "A kind word, a finished task, a good song — small counts.",
    ph: "e.g. A coworker covered a call so I could take a breather." },
  { field: "three", type: "write", kicker: "Good things · 3 of 3", title: "And one more good thing?",
    hint: "However tiny. Naming it on purpose is the whole practice.",
    ph: "e.g. I finally replied to that email I'd been dreading." },
];

// initial data: the three good things
function emptyEntries() {
  return { one: "", two: "", three: "" };
}

/* ============================================================
 * Moment-of-delight motifs (ported from the Immersion look).
 * ============================================================ */
const MOTIFS = [
  { id: "stars", label: "Stars", emoji: "✨" },
  { id: "rings", label: "Rings", emoji: "◎" },
  { id: "logo",  label: "Logo",  emoji: "◠" },
];
const CEL_CAPTIONS = ["", "Great job naming your first good thing.", "That's two — lovely.", "Three. Beautifully done."];
const CEL_CTAS = ["", "Let's name another", "Let's name one more"];
const STAR_POS = [ { left: "24%", top: "60%" }, { left: "50%", top: "30%" }, { left: "76%", top: "58%" } ];
const CELEB_MS = 1650;
const CELEB_DONE_MS = 1900;

function StarShape({ size = 42 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" aria-hidden="true">
      <defs>
        <radialGradient id="starg" cx="40%" cy="34%" r="70%">
          <stop offset="0%" stopColor="#fff6d6" />
          <stop offset="60%" stopColor="#ffd166" />
          <stop offset="100%" stopColor="#f4a83c" />
        </radialGradient>
      </defs>
      <path d="M12 2l2.6 6.3L21 9l-5 4.6L17.5 21 12 17.3 6.5 21 8 13.6 3 9l6.4-.7z" fill="url(#starg)" />
    </svg>
  );
}

// One scene for both the per-entry beat (isNew: animate the newest item) and the Done crest (idle).
function MotifScene({ motif, count, isNew }) {
  if (motif === "logo") {
    const ARCS = [
      { x: "2.264", y: "12.09", w: "18.527", h: "4.796",  vb: "0 0 19.2818 4.82726", d: "M9.6409 0.00415971C7.74432 -0.0466691 5.86536 0.369028 4.17945 1.21245C2.49354 2.05587 1.05565 3.29951 0 4.82726H19.2818C18.2262 3.29951 16.7883 2.05587 15.1023 1.21245C13.4164 0.369028 11.5375 -0.0466691 9.6409 0.00415971Z" },
      { x: "1.582", y: "6.319", w: "19.889", h: "9.998",  vb: "0 0 20.6998 10.066",  d: "M10.3487 0.00169587C7.65891 -0.0460333 5.05927 0.941494 3.11947 2.74788C1.17967 4.55426 0.0579042 7.03217 0 9.63861C0 9.78184 0.00399474 9.92429 0.0111847 10.066C0.573608 9.2118 1.26546 8.44452 2.06351 7.78989C4.38906 5.91715 7.32684 4.90826 10.3503 4.94402C13.3738 4.90812 16.3116 5.91703 18.6371 7.78989C19.4348 8.44484 20.1266 9.21207 20.6894 10.066C20.6958 9.92429 20.6998 9.78184 20.6998 9.63861C20.6419 7.03176 19.5198 4.55349 17.5795 2.74704C15.6392 0.940594 13.0389 -0.0466553 10.3487 0.00169587Z" },
      { x: "0", y: "0", w: "23.06", h: "15.584", vb: "0 0 24 15.6895", d: "M11.9972 5.48972C14.8709 5.44427 17.6505 6.48269 19.7491 8.38578C21.8476 10.2889 23.101 12.9077 23.2447 15.6895C23.921 13.9306 24.1479 12.0393 23.9061 10.177C23.6643 8.31474 22.9609 6.53685 21.856 4.99523C20.7511 3.4536 19.2776 2.19406 17.5613 1.3242C15.845 0.454337 13.9369 0 12 0C10.0631 0 8.15503 0.454337 6.43872 1.3242C4.7224 2.19406 3.24886 3.4536 2.14398 4.99523C1.0391 6.53685 0.335709 8.31474 0.0938929 10.177C-0.147923 12.0393 0.0790229 13.9306 0.755345 15.6895C0.899154 12.9088 2.15186 10.291 4.2492 8.38819C6.34655 6.48541 9.12455 5.44646 11.9972 5.4905V5.48972Z" },
    ];
    return (
      <div className={"cl-mark" + (isNew ? "" : " idle")}>
        <svg width="220" viewBox="0 0 23.06 16.886" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="clgrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#2f8ae8" /><stop offset="100%" stopColor="#075cba" />
            </linearGradient>
          </defs>
          {ARCS.map((a, i) => (
            <svg key={"g" + i} x={a.x} y={a.y} width={a.w} height={a.h} viewBox={a.vb} className="cl-arc cl-ghost"><path d={a.d} /></svg>
          ))}
          {ARCS.map((a, i) => i < count ? (
            <svg key={"f" + i} x={a.x} y={a.y} width={a.w} height={a.h} viewBox={a.vb}
              className={"cl-arc cl-fill" + (isNew && i === count - 1 ? " cl-wipe" : "")}><path d={a.d} /></svg>
          ) : null)}
        </svg>
      </div>
    );
  }
  if (motif === "rings") {
    const RINGS = [
      { r: 62, a: "#F31260", b: "#FF7A3D" },
      { r: 45, a: "#34C759", b: "#A8F24A" },
      { r: 28, a: "#0AB4E6", b: "#19E6CE" },
    ];
    return (
      <div className={"m-rings" + (isNew ? "" : " idle")}>
        <svg viewBox="0 0 160 160" width="180" height="180" aria-hidden="true">
          <defs>
            {RINGS.map((ring, i) => (
              <linearGradient key={i} id={"rg" + i} x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor={ring.a} /><stop offset="100%" stopColor={ring.b} />
              </linearGradient>
            ))}
          </defs>
          <g transform="rotate(-90 80 80)">
            {RINGS.map((ring, i) => {
              const C = 2 * Math.PI * ring.r;
              const done = i < count;
              const animating = isNew && i === count - 1;
              return (
                <g key={i}>
                  <circle cx="80" cy="80" r={ring.r} fill="none" stroke={ring.a} strokeOpacity="0.16" strokeWidth="13" />
                  <circle cx="80" cy="80" r={ring.r} fill="none" stroke={"url(#rg" + i + ")"} strokeWidth="13"
                    strokeLinecap="round" strokeDasharray={C} strokeDashoffset={done ? 0 : C}
                    className={animating ? "ring-fill" : ""} style={animating ? { "--c": C } : null} />
                </g>
              );
            })}
          </g>
        </svg>
      </div>
    );
  }
  // stars (default)
  const pts = STAR_POS.slice(0, count);
  const newest = STAR_POS[count - 1];
  return (
    <div className="m-stars">
      {count >= 2 && (
        <svg className="m-line" viewBox="0 0 300 150" preserveAspectRatio="none">
          <path d={pts.map((p, i) => (i ? "L" : "M") + (parseFloat(p.left) / 100 * 300) + " " + (parseFloat(p.top) / 100 * 150)).join(" ")} />
        </svg>
      )}
      {pts.map((p, i) => (
        <span key={i} className={"m-star " + (isNew && i === count - 1 ? "pop" : "idle")}
          style={{ left: p.left, top: p.top, animationDelay: (i * 0.1) + "s" }}>
          <StarShape size={isNew && i === count - 1 ? 48 : 42} />
        </span>
      ))}
      {isNew && Array.from({ length: 6 }).map((_, i) => {
        const ang = (i / 6) * Math.PI * 2;
        return <span key={"sp" + i} className="m-spark go"
          style={{ left: newest.left, top: newest.top, "--dx": Math.cos(ang) * 46 + "px", "--dy": Math.sin(ang) * 46 + "px" }} />;
      })}
    </div>
  );
}

// The between-screens beat: caption + growing scene + echoed words + (for #1/#2) a Continue button.
function Celebration({ motif, count, text, onContinue }) {
  const [showBtn, setShowBtn] = useState(false);
  React.useEffect(() => {
    if (!onContinue) return;
    const t = setTimeout(() => setShowBtn(true), 1250);
    return () => clearTimeout(t);
  }, [onContinue]);
  return (
    <div className="u-celeb">
      <span className="u-celeb-caption">{CEL_CAPTIONS[count] || "Noticed."}</span>
      <div className="u-celeb-scene"><MotifScene motif={motif} count={count} isNew={true} /></div>
      <p className="u-celeb-echo">{text && text.trim() ? "“" + text.trim() + "”" : "Noticed — that counts too."}</p>
      {onContinue && (
        <div className={"u-celeb-cta" + (showBtn ? " in" : "")}>
          <Button variant="filled" trailingIcon={<IcArrowR size={18} />} onClick={onContinue}>{CEL_CTAS[count] || "Let's name another"}</Button>
        </div>
      )}
    </div>
  );
}

function MotifPicker({ value, onChange }) {
  return (
    <div className="motif-picker">
      <span className="mp-label">Delight style</span>
      <div className="mp-seg">
        {MOTIFS.map(m => (
          <button key={m.id} className={"mp-btn" + (value === m.id ? " on" : "")} onClick={() => onChange(m.id)}>
            <span aria-hidden="true">{m.emoji}</span>{m.label}
          </button>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [idx, setIdx] = useState(0);
  const [senseIdx, setSenseIdx] = useState(0);
  const [data, setData] = useState(emptyEntries());
  const [motif, setMotif] = useState("stars");
  const [celeb, setCeleb] = useState(null); // { count, text, toDone } while a delight beat plays

  // Shell bridge: read this module's step + progress and hydrate the sibling look (Utility ↔ Immersion)
  // without reloading. The two written lines + chosen reminder transfer, plus the current sub-step via _ex.
  React.useEffect(() => {
    function onMsg(e) {
      var m = e && e.data;
      if (!m || typeof m !== "object") return;
      if (m.type === "reset:getState") {
        var w = e.source || window.parent;
        if (w) w.postMessage({ type: "reset:state", idx: idx, data: { one: data.one, two: data.two, three: data.three, _ex: senseIdx } }, "*");
      } else if (m.type === "reset:next") {
        setIdx(function (i) { return Math.min(i + 1, STEPS.length - 1); });
      } else if (m.type === "reset:prev") {
        setIdx(function (i) { return Math.max(i - 1, 0); });
      } else if (m.type === "reset:setState") {
        if (typeof m.idx === "number") setIdx(m.idx);
        if (m.data && typeof m.data === "object") {
          var inc = Object.assign({}, m.data);
          if (typeof inc._ex === "number") setSenseIdx(inc._ex);
          delete inc._ex;
          setData(function (d) { return Object.assign({}, d, inc); });
        }
      }
    }
    window.addEventListener("message", onMsg);
    return function () { window.removeEventListener("message", onMsg); };
  }, [idx, data, senseIdx]);

  const cur = STEPS[idx];
  const last = idx === STEPS.length - 1;
  const inGround = cur.key === "ground";

  const advanceFromCeleb = () => { setCeleb(null); setSenseIdx(function (s) { return s + 1; }); };

  const goNext = () => {
    if (celeb) return;
    if (inGround) {
      const text = data[SC_STEPS[senseIdx].field];
      const count = senseIdx + 1;
      const toDone = senseIdx >= SC_LAST;
      setCeleb({ count: count, text: text, toDone: toDone });
      if (toDone) {
        // the final fill holds a beat, then auto-advances to the recap
        setTimeout(function () { setCeleb(null); setIdx(function (i) { return i + 1; }); }, CELEB_DONE_MS);
      }
      // #1 and #2 wait for the "Let's name another / one more" button (advanceFromCeleb)
    } else {
      setIdx(idx + 1);
    }
  };
  const goBack = () => { if (celeb) return; if (inGround && senseIdx > 0) setSenseIdx(senseIdx - 1); else if (idx > 0) setIdx(idx - 1); };

  const nextLabel = idx === 0 ? "Begin" : (inGround && senseIdx < SC_LAST ? "Next" : "Continue");

  const screen = {
    intro:  <Intro />,
    learn:  <Learn />,
    ground: celeb
      ? <Celebration motif={motif} count={celeb.count} text={celeb.text} onContinue={celeb.toDone ? null : advanceFromCeleb} />
      : <GroundWalk data={data} set={setData} stage={senseIdx} />,
    done:   <Done data={data} motif={motif} />,
  }[cur.key];

  const actions = celeb ? null : last ? (
    <>
      <Button variant="outlined" onClick={() => { setIdx(0); setSenseIdx(0); setData(emptyEntries()); }}>Run it again</Button>
      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
        <Button variant="tonal" leadingIcon={<IcBell size={18} />}>Set a Reminder</Button>
        <Button variant="filled" trailingIcon={<IcArrowR size={18} />}>Back to Stress Program</Button>
      </div>
    </>
  ) : (
    <>
      <Button variant="outlined" leadingIcon={<IcChevL size={18} />} disabled={idx === 0} onClick={goBack}>Go Back</Button>
      <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
        <span className="actions-help">{inGround ? ("Step " + (senseIdx + 1) + " of 3") : ("Step " + (idx + 1) + " of " + STEPS.length)}</span>
        <Button variant="filled" trailingIcon={<IcArrowR size={18} />} onClick={goNext}>{nextLabel}</Button>
      </div>
    </>
  );

  return (
    <div className="frame">
      <div className="screen" key={cur.key}>
        <div className="app">
          <HeaderNav />
          <ContentSectionTemplate steps={STEPS} current={idx} actions={actions}
            whole={cur.key === "intro" || cur.key === "done" || !!celeb}
            belowProgress={cur.key !== "intro" ? <MotifPicker value={motif} onChange={setMotif} /> : null}>
            {screen}
          </ContentSectionTemplate>
        </div>
      </div>

    </div>
  );
}
